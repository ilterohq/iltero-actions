version: 1
iac_tool: terraform
assertions:
  paths:
    - assertions
  include_starter_assertions: false
  custom_policies: []
  scanner_check_mapping: null
  scanner_requirements: []
  local_exceptions: null
  values_known_after_deployment: postpone
redaction:
  additional_paths: []
  exempt_paths: []
environments:
  e2e:
    git_ref:
      type: branch
      name: main
stages:
  out_of_scope:
    - post_verify
