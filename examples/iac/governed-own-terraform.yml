# Reference workflow for a team that runs Terraform itself, in a governed run
# on Iltero Platform. A repository owner copies it into .github/workflows/
# and replaces the example values.
#
# A push to main deploys one unit to production. The job runs its own
# terraform plan and apply. Iltero steps between them record each stage:
#   plan         after terraform plan, from the saved plan;
#   pre_deploy   before terraform apply, after the job plans again: stops
#                the job when a blocking check fails, before anything is
#                applied. Required when the governed run expects it, which
#                a run to production always does;
#   post_deploy  after terraform apply, also when the apply failed;
#   post_verify  after post_deploy: checks that the deployed resources
#                still match what the apply left, from two readings of
#                them taken at least 60 seconds apart. A reading is a
#                refresh-only plan. Never apply one: it writes what it
#                reads into the state, so drift no longer shows.
# The plan stage's check opens the run on Iltero Platform, and each later
# stage joins it. Iltero Platform accepts post_deploy only from the job that
# ran pre_deploy, so keep pre_deploy, the apply and post_deploy in one job.
# The close job closes the run when the deploy job succeeded. When the deploy
# job failed or was cancelled, a re-run of it opens a new run, which plans
# and applies again, and the earlier run ends. When the job failed before
# any unit went past its plan stage, the re-run joins the earlier run.
#
# Plan, apply, state and reading files stay in the runner's temporary
# directory, never in the checked-out repository. The readings can hold
# secret values: never upload or keep them. The record keeps no copy of
# them, only a fingerprint of each reading. The pre_deploy step reads the
# plan stage's record from the records directory.
#
# The Plan again step plans the unit a second time, just before pre_deploy,
# with the same configuration and variables, into a file of its own. It first
# waits one second, because Terraform dates a plan to the second and the CLI
# refuses a new plan that is not newer than the checked plan. pre_deploy gets
# the new plan as replan. The CLI compares it with the checked plan and
# records only the result. The job never applies the new plan: the Apply step
# applies the saved plan.
#
# A pre_deploy step in another job must download the records artifact and pass
# its directory as records-directory. That job must also plan again, just
# before pre_deploy, and give the saved-plan, plan and replan inputs.
# saved-plan names the saved plan file the job will apply, plan names the plan
# rendered from it with terraform show -json, and replan names the new plan.
#
# Each record-iac step sets store-records, so the CLI also keeps the stage's
# record and every file it cites in the run's artifact store: the Amazon
# Simple Storage Service (S3) bucket that Iltero Platform names for the run,
# in the deploy role's own account. The CLI uses the job's AWS credentials.
# The deploy role needs s3:PutObject, s3:PutObjectRetention and
# s3:GetObjectRetention on the objects
# arn:aws:s3:::BUCKET/<prefix>artifacts/<organization id>/*, where <prefix> is
# the folder path inside the bucket that Iltero Platform gives for the run's
# artifact store, or empty. It needs kms:GenerateDataKey on the bucket's Key
# Management Service (KMS) key, restricted with the kms:ViaService condition
# to S3 in the bucket's region. The role, the bucket and its key are in one
# AWS account.
#
# Terraform runs with a scrubbed environment, so Terraform and its providers
# see only the variables in a list. Each of the five steps that run terraform
# defines a scrubbed function. The function runs one command with only the
# variables in its keep= list and the job's TF_VAR_ variables, which set the
# Terraform configuration's input variables. The step's other commands keep
# every variable. The list holds PATH, HOME, TF_DATA_DIR, the AWS credentials
# and settings, and the proxy and certificate settings. To pass another
# variable your Terraform reads, such as another cloud's credentials, add it
# to the keep= list in all five steps. A step whose list lacks it runs
# Terraform without it.
#
# Commit each unit's Terraform lock file, .terraform.lock.hcl, which records
# the provider versions the unit uses. terraform init uses the file as
# committed and never changes it.
#
# Values the owner replaces:
#   the actions release (each 0000000000000000000000000000000000000000 is a
#   placeholder for the 40-character commit ID of the iltero-actions release
#   you use, and each # v0.3.0 comment a placeholder for its version),
#   the environment's name and branch, the GitHub deployment environment, the
#   deploy role's Amazon Resource Name (ARN) and region, the unit's name and
#   directory, and ILTERO_API_URL, which must be the same address as
#   platform.api_url in .iltero/config.yml. The stack comes from the platform
#   section of .iltero/config.yml.

name: Iltero

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  ILTERO_API_URL: https://api.iltero.io/v1

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    # Set this above the time the slowest apply takes.
    timeout-minutes: 180
    environment: production
    concurrency:
      group: iltero-production
      cancel-in-progress: false
    permissions:
      contents: read # check out the stack
      id-token: write # the job's identity token, for Iltero and the deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5 # the version deploy and preview install by default
          terraform_wrapper: false
      - uses: ilterohq/iltero-actions/setup@0000000000000000000000000000000000000000 # v0.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::123456789012:role/iltero-deploy-production
          aws-region: eu-west-1
      - name: Plan
        working-directory: units/network
        run: |
          # Terraform runs with a scrubbed environment: it gets only the
          # variables in this list and the job's TF_VAR_ variables. To pass
          # another variable, see the comments at the top of this file.
          scrubbed() (
            keep=(PATH HOME TF_DATA_DIR
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
              AWS_PROFILE AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_CA_BUNDLE
              HTTPS_PROXY HTTP_PROXY NO_PROXY https_proxy http_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR)
            remove=()
            while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              # Keep a variable that is in the list or starts with TF_VAR_.
              [[ " ${keep[*]} " == *" ${name} "* || "${name}" == TF_VAR_* ]] || remove+=(-u "${name}")
            done < <(env -0)
            # Stop when the environment could not be read.
            wait "$!"
            exec env "${remove[@]}" "$@"
          )
          scrubbed terraform init -input=false -lockfile=readonly
          scrubbed terraform plan -input=false -out="${RUNNER_TEMP}/network.tfplan"
          scrubbed terraform show -json "${RUNNER_TEMP}/network.tfplan" > "${RUNNER_TEMP}/network-plan.json"
      - uses: ilterohq/iltero-actions/record-iac@0000000000000000000000000000000000000000 # v0.3.0
        with:
          stage: plan
          environment: production
          unit: network
          store-records: true
          plan: ${{ runner.temp }}/network-plan.json
          saved-plan: ${{ runner.temp }}/network.tfplan
      - name: Plan again
        working-directory: units/network
        run: |
          # Terraform runs with a scrubbed environment: it gets only the
          # variables in this list and the job's TF_VAR_ variables. To pass
          # another variable, see the comments at the top of this file.
          scrubbed() (
            keep=(PATH HOME TF_DATA_DIR
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
              AWS_PROFILE AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_CA_BUNDLE
              HTTPS_PROXY HTTP_PROXY NO_PROXY https_proxy http_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR)
            remove=()
            while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              # Keep a variable that is in the list or starts with TF_VAR_.
              [[ " ${keep[*]} " == *" ${name} "* || "${name}" == TF_VAR_* ]] || remove+=(-u "${name}")
            done < <(env -0)
            # Stop when the environment could not be read.
            wait "$!"
            exec env "${remove[@]}" "$@"
          )
          # Terraform dates a plan to the second, and the CLI refuses a new
          # plan that is not newer than the checked plan.
          sleep 1
          scrubbed terraform plan -input=false -out="${RUNNER_TEMP}/network-replan.tfplan"
          scrubbed terraform show -json "${RUNNER_TEMP}/network-replan.tfplan" > "${RUNNER_TEMP}/network-replan.json"
      - uses: ilterohq/iltero-actions/record-iac@0000000000000000000000000000000000000000 # v0.3.0
        with:
          stage: pre_deploy
          environment: production
          unit: network
          store-records: true
          plan: ${{ runner.temp }}/network-plan.json
          saved-plan: ${{ runner.temp }}/network.tfplan
          replan: ${{ runner.temp }}/network-replan.json

      - id: apply
        name: Apply
        working-directory: units/network
        run: |
          # Terraform runs with a scrubbed environment: it gets only the
          # variables in this list and the job's TF_VAR_ variables. To pass
          # another variable, see the comments at the top of this file.
          scrubbed() (
            keep=(PATH HOME TF_DATA_DIR
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
              AWS_PROFILE AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_CA_BUNDLE
              HTTPS_PROXY HTTP_PROXY NO_PROXY https_proxy http_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR)
            remove=()
            while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              # Keep a variable that is in the list or starts with TF_VAR_.
              [[ " ${keep[*]} " == *" ${name} "* || "${name}" == TF_VAR_* ]] || remove+=(-u "${name}")
            done < <(env -0)
            # Stop when the environment could not be read.
            wait "$!"
            exec env "${remove[@]}" "$@"
          )
          scrubbed terraform apply -input=false -json "${RUNNER_TEMP}/network.tfplan" > "${RUNNER_TEMP}/network-apply.ndjson"
      - id: state
        name: Read the state
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        working-directory: units/network
        run: |
          # Terraform runs with a scrubbed environment: it gets only the
          # variables in this list and the job's TF_VAR_ variables. To pass
          # another variable, see the comments at the top of this file.
          scrubbed() (
            keep=(PATH HOME TF_DATA_DIR
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
              AWS_PROFILE AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_CA_BUNDLE
              HTTPS_PROXY HTTP_PROXY NO_PROXY https_proxy http_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR)
            remove=()
            while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              # Keep a variable that is in the list or starts with TF_VAR_.
              [[ " ${keep[*]} " == *" ${name} "* || "${name}" == TF_VAR_* ]] || remove+=(-u "${name}")
            done < <(env -0)
            # Stop when the environment could not be read.
            wait "$!"
            exec env "${remove[@]}" "$@"
          )
          scrubbed terraform show -json > "${RUNNER_TEMP}/network-state.json"
      - if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        uses: ilterohq/iltero-actions/record-iac@0000000000000000000000000000000000000000 # v0.3.0
        with:
          stage: post_deploy
          environment: production
          unit: network
          store-records: true
          plan: ${{ runner.temp }}/network-plan.json
          saved-plan: ${{ runner.temp }}/network.tfplan
          apply-log: ${{ runner.temp }}/network-apply.ndjson
          # Pass the state when the step that reads it succeeded. When it
          # failed, set state-unreadable instead: the CLI then records the
          # apply from the apply log alone, and the step fails.
          state: ${{ steps.state.outcome == 'success' && format('{0}/network-state.json', runner.temp) || '' }}
          state-unreadable: ${{ steps.state.outcome == 'failure' }}

      - name: Read the deployed resources back
        working-directory: units/network
        run: |
          # Terraform runs with a scrubbed environment: it gets only the
          # variables in this list and the job's TF_VAR_ variables. To pass
          # another variable, see the comments at the top of this file.
          scrubbed() (
            keep=(PATH HOME TF_DATA_DIR
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
              AWS_PROFILE AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_CA_BUNDLE
              HTTPS_PROXY HTTP_PROXY NO_PROXY https_proxy http_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR)
            remove=()
            while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              # Keep a variable that is in the list or starts with TF_VAR_.
              [[ " ${keep[*]} " == *" ${name} "* || "${name}" == TF_VAR_* ]] || remove+=(-u "${name}")
            done < <(env -0)
            # Stop when the environment could not be read.
            wait "$!"
            exec env "${remove[@]}" "$@"
          )
          scrubbed terraform plan -input=false -refresh-only -lock-timeout=5m -out="${RUNNER_TEMP}/network-first.tfplan"
          scrubbed terraform show -json "${RUNNER_TEMP}/network-first.tfplan" > "${RUNNER_TEMP}/network-first.json"
          sleep 60
          scrubbed terraform plan -input=false -refresh-only -lock-timeout=5m -out="${RUNNER_TEMP}/network-second.tfplan"
          scrubbed terraform show -json "${RUNNER_TEMP}/network-second.tfplan" > "${RUNNER_TEMP}/network-second.json"
      - uses: ilterohq/iltero-actions/record-iac@0000000000000000000000000000000000000000 # v0.3.0
        with:
          stage: post_verify
          environment: production
          unit: network
          store-records: true
          refresh-only-plans: |
            ${{ runner.temp }}/network-first.json
            ${{ runner.temp }}/network-second.json
          # The same state file that post_deploy took.
          state: ${{ runner.temp }}/network-state.json

  close:
    name: Close production
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: iltero-close-production
      cancel-in-progress: false
    permissions:
      contents: read # read the stack's .iltero/config.yml
      id-token: write # the job's identity token, for Iltero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilterohq/iltero-actions/setup@0000000000000000000000000000000000000000 # v0.3.0
      - uses: ilterohq/iltero-actions/close@0000000000000000000000000000000000000000 # v0.3.0
        with:
          environment: production
