# Deploys a stack in a project not linked to Iltero Platform: its
# .iltero/config.yml has no platform section. On the runner, the deploy step
# checks each unit's plan, applies the saved plan and records the deployment.
# For each unit whose record requires the post-verify stage, it then checks
# that the deployed resources still match what the apply left. The CLI sends
# nothing to Iltero. The last step builds each unit's record bundle, checks
# it, and uploads the record bundles.
#
# List pre_deploy under stages.out_of_scope in .iltero/config.yml. The
# pre-deploy stage checks facts that only Iltero Platform holds, so the deploy
# step fails before the apply when a unit's record requires it.
#
# List the folders of the project's own assertions under assertions.paths in
# .iltero/config.yml, and leave assertions.include_starter_assertions false.
# The starter assertions are the ones shipped with Iltero.
#
# Values the owner replaces:
#   the actions commit (each 0000000000000000000000000000000000000000 is a
#   placeholder for the 40-character ID of the iltero-actions commit you use,
#   and each # v0.3.0 comment a placeholder for the version of its release),
#   the branch, the environment, and the deploy role's Amazon Resource Name
#   (ARN) and region.

name: Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    # Set this above the time the slowest apply takes.
    timeout-minutes: 180
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read # check out the project
      id-token: write # the job's identity token, for the deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilterohq/iltero-actions/setup@0000000000000000000000000000000000000000 # v0.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::123456789012:role/deploy
          aws-region: eu-west-1
      - id: deploy
        uses: ilterohq/iltero-actions/deploy@0000000000000000000000000000000000000000 # v0.3.0
        with:
          environment: production
      - if: always() && steps.deploy.outputs.records-directory != ''
        uses: ilterohq/iltero-actions/verify@0000000000000000000000000000000000000000 # v0.3.0
        with:
          environment: production
          records-directory: ${{ steps.deploy.outputs.records-directory }}
