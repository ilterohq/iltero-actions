# Deploys a stack with no Iltero account: .iltero/config.yml has no platform
# section. On the runner, the deploy step checks each unit's plan, applies the
# saved plan and records the deployment. For each unit whose record expects
# the post-verify stage, it then checks that the deployed resources still
# match what the apply left. The CLI sends nothing to Iltero. The last step
# packs each unit's record and checks it, and uploads the record bundles.
#
# In a project with no platform section, list pre_deploy under
# stages.out_of_scope in .iltero/config.yml. deploy does not run the
# pre-deploy stage there, because it checks facts that only Iltero Platform
# holds.
#
# Values the owner replaces:
#   the actions commit (40 hex characters), the branch, the environment, and
#   the deploy role's Amazon Resource Name (ARN) and region.

name: Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read # check out the project
      id-token: write # the job's identity token, for the deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilterohq/iltero-actions/setup@0000000000000000000000000000000000000000 # v0.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::123456789012:role/deploy
          aws-region: eu-west-1
      - id: deploy
        uses: ilterohq/iltero-actions/deploy@0000000000000000000000000000000000000000 # v0.3.0
        with:
          environment: production
      - if: always() && steps.deploy.outputs.records-directory != ''
        uses: ilterohq/iltero-actions/verify@0000000000000000000000000000000000000000 # v0.3.0
        with:
          environment: production
          records-directory: ${{ steps.deploy.outputs.records-directory }}
