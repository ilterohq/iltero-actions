name: Iltero Preview
description: Check each unit's plan locally on a pull request, with no cloud credential and no Iltero secret.
author: Iltero

branding:
  icon: eye
  color: blue

inputs:
  environment:
    description: >-
      The environment to check the change against. When it is empty, the CLI finds it from the pull request's target
      branch. Set it when the target branch deploys to several environments.
    required: false
    default: ""
  working-directory:
    description: The stack's directory, relative to the repository root.
    required: false
    default: "."
  registry-host:
    description: >-
      Host name of Iltero Platform's private module registry, from which the IaC tool downloads private modules.
      Leave empty when the stack uses no private modules. When it is set, the project must be linked to Iltero
      Platform, and the job needs id-token: write.
    required: false
    default: ""
  upload-records:
    description: >-
      true or false. When true, the action uploads each unit's records as the artifact named by artifact-name. The
      records hold a redacted copy of each plan.
    required: false
    default: "false"
  artifact-name:
    description: >-
      Name of the artifact that holds the records when upload-records is true. The comment artifact takes this name
      with -comment added.
    required: false
    default: iltero-preview
  tool:
    description: >-
      The infrastructure-as-code (IaC) tool the stack uses, to install and run. Supported: terraform.
    required: false
    default: terraform
  tool-version:
    description: >-
      The version of the tool to install and run. When the input is empty, the action installs the version it pins as
      the tool's default. The action accepts only versions whose checksums it pins.
    required: false
    default: ""

outputs:
  tool-version:
    description: The version of the IaC tool installed.
    value: ${{ steps.tool.outputs.tool-version }}
  tool-path:
    description: Absolute path of the IaC tool's binary.
    value: ${{ steps.tool.outputs.tool-path }}
  environment:
    description: The environment the change is checked against.
    value: ${{ steps.environment.outputs.environment }}
  records-directory:
    description: The directory that holds the records.
    value: ${{ steps.preview.outputs.records-directory }}
  comment-artifact:
    description: >-
      Name of the artifact that holds the pull request comment, for the comment action. Empty when no comment was
      written.
    value: ${{ steps.environment.outputs.comment-directory != '' && format('{0}-comment', inputs.artifact-name) || '' }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
        UPLOAD_RECORDS: ${{ inputs.upload-records }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/preview.sh" check "${ARTIFACT_NAME}"'

    - name: Install the IaC tool
      id: tool
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        TOOL_VERSION: ${{ inputs.tool-version }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/install-tool.sh" "${TOOL}" "${TOOL_VERSION}"'

    - name: Find the environment
      id: environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOL: ${{ inputs.tool }}
        ENVIRONMENT: ${{ inputs.environment }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/preview.sh" environment'

    - name: Plan and check each unit
      id: preview
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOL: ${{ inputs.tool }}
        ENVIRONMENT: ${{ steps.environment.outputs.environment }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/preview.sh" run "${ENVIRONMENT}"'

    - name: Upload the records
      if: always() && inputs.upload-records == 'true' && steps.preview.outputs.records-directory != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.preview.outputs.records-directory }}
        retention-days: 30
        if-no-files-found: error

    - name: Upload the comment
      if: always() && steps.environment.outputs.comment-directory != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}-comment
        path: ${{ steps.environment.outputs.comment-directory }}
        retention-days: 1
        if-no-files-found: error
