# =============================================================================
# Setup Iltero CLI - Internal Action
# =============================================================================
# Purpose: Install compliance scanning tools (Iltero CLI, Checkov, OPA)
#
# This is an internal action bundled with iltero-actions. It installs:
#   - Iltero CLI for compliance scan orchestration and webhook submission
#   - Checkov for static infrastructure code analysis
#   - OPA for policy evaluation on Terraform plans
#
# Optionally includes the base toolchain (Terraform, yq, jq) via the
# install-toolchain input for workflows that need both scanning AND deployment.
# =============================================================================

name: Setup Iltero CLI
description: Install compliance scanning tools (Iltero CLI, Checkov, OPA) with optional infrastructure toolchain

inputs:
  version:
    description: |
      Iltero CLI version to install. Pinned by default so a new CLI release
      cannot change what blocks a deployment without an explicit change here.
      Must be 0.7.0 or newer.
    required: false
    default: '0.7.1'
  python-version:
    description: Python version to use
    required: false
    default: '3.11'
  install-checkov:
    description: Install Checkov for static analysis
    required: false
    default: 'true'
  install-opa:
    description: Install OPA for policy evaluation
    required: false
    default: 'false'
  opa-version:
    description: OPA version to install
    required: false
    default: '0.60.0'
  install-toolchain:
    description: Also install infrastructure toolchain (Terraform, yq, jq)
    required: false
    default: 'false'
  terraform-version:
    description: |
      Terraform version to install (only used if install-toolchain is true).
      Accepts an exact version, `latest`, or a semver range. Iltero requires
      Terraform >= 1.10 for S3 native state locking (use_lockfile).
    required: false
    default: '~1.10'
  api-url:
    description: |
      Iltero API URL. Defaults to https://api.iltero.io if not provided.
      Can also be set via ILTERO_API_URL environment variable.
    required: false
    default: ''
  api-token:
    description: Iltero API token
    required: false
    default: ''

outputs:
  cli-version:
    description: Installed CLI version
    value: ${{ steps.verify.outputs.cli-version }}
  checkov-version:
    description: Installed Checkov version
    value: ${{ steps.verify.outputs.checkov-version }}
  opa-version:
    description: Installed OPA version
    value: ${{ steps.verify.outputs.opa-version }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Install yq (optional - when toolchain requested)
    # -------------------------------------------------------------------------
    - name: Install yq
      if: inputs.install-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail

        YQ_VERSION="v4.35.2"
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # --fail: without it curl writes an error page body to the
        # destination and still exits 0, so an HTTP 404 gets installed as
        # the binary and the step below reports success.
        if ! curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}" -o /tmp/yq; then
          echo "::error::Failed to download yq"
          exit 1
        fi
        sudo mv /tmp/yq /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
        if ! yq --version > /dev/null 2>&1; then
          echo "::error::yq was downloaded but does not run"
          exit 1
        fi

        echo "✅ yq installed"

    # -------------------------------------------------------------------------
    # Install jq (optional - when toolchain requested)
    # -------------------------------------------------------------------------
    - name: Install jq
      if: inputs.install-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail

        if command -v jq &> /dev/null; then
          exit 0
        fi

        JQ_VERSION="1.7"
        ARCH=$(uname -m)

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # --fail: without it curl writes an error page body to the
        # destination and still exits 0, so an HTTP 404 gets installed as
        # the binary and the step below reports success.
        if ! curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-${ARCH}" -o /tmp/jq; then
          echo "::error::Failed to download jq"
          exit 1
        fi
        sudo mv /tmp/jq /usr/local/bin/jq
        sudo chmod +x /usr/local/bin/jq
        if ! jq --version > /dev/null 2>&1; then
          echo "::error::jq was downloaded but does not run"
          exit 1
        fi

        echo "✅ jq installed"

    # -------------------------------------------------------------------------
    # Setup Terraform (optional - when toolchain requested)
    # -------------------------------------------------------------------------
    - name: Setup Terraform
      if: inputs.install-toolchain == 'true'
      uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    # -------------------------------------------------------------------------
    # Install Python dependencies (optional - when toolchain requested)
    # -------------------------------------------------------------------------
    - name: Install Python dependencies
      if: inputs.install-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pip3 install --user --break-system-packages pyyaml jsonschema 2>/dev/null || \
          pip3 install --user pyyaml jsonschema
        echo "✅ Python dependencies installed"

    # -------------------------------------------------------------------------
    # Setup Python
    # -------------------------------------------------------------------------
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    # -------------------------------------------------------------------------
    # Install Iltero CLI
    # -------------------------------------------------------------------------
    - name: Install Iltero CLI
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Constrain the version before it is used anywhere. It reaches the run
        # log, and a value carrying a newline is emitted there as further
        # workflow commands rather than as text — `::stop-commands::` would
        # silence every command after it, including a later secret mask. Match
        # with [[ =~ ]], whose anchors bind the whole string rather than one
        # line.
        if [[ "${INPUT_VERSION}" != "latest" && -n "${INPUT_VERSION}" ]] &&
           [[ ! "${INPUT_VERSION}" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
          echo "::error::version must be 'latest' or an exact version such as 0.6.3"
          exit 1
        fi

        if [ "$INPUT_VERSION" = "latest" ]; then
          PIP_ARGS=(--quiet --upgrade iltero-cli)
        else
          PIP_ARGS=(--quiet "iltero-cli==${INPUT_VERSION}")
        fi

        # Install to a log rather than through a filter. Piping into grep hands
        # the pipeline grep's status — "nothing left to print" — and the `|| true`
        # that silences it then swallows a failed install too. When an older CLI
        # is already on PATH, that combination runs the whole job on a version
        # nobody selected.
        #
        # `python -m pip` rather than `pip`: the version is read back from the
        # installed package's metadata, so both must be the same interpreter
        # rather than coincidentally the same by PATH order.
        PIP_LOG=$(mktemp)
        if ! python -m pip install "${PIP_ARGS[@]}" > "${PIP_LOG}" 2>&1; then
          cat "${PIP_LOG}"
          echo "::error::Iltero CLI install failed"
          exit 1
        fi
        grep -v "^Requirement\|^Collecting\|^Downloading\|^Using cached\|^Installing" \
          "${PIP_LOG}" || true

        # Capture the absolute path of the just-installed CLI so downstream
        # steps invoke it directly rather than via PATH lookup.
        ILTERO_CLI_BIN_PATH=$(command -v iltero || true)
        if [ -z "${ILTERO_CLI_BIN_PATH}" ] || [ ! -x "${ILTERO_CLI_BIN_PATH}" ]; then
          echo "::error::Iltero CLI install reported success but binary is not on PATH"
          exit 1
        fi

        # Assert the resolved path is under the Python install prefix exported
        # by actions/setup-python. Pinning without this would make a stale or
        # pre-existing iltero elsewhere on PATH the deterministic choice.
        if [ -n "${pythonLocation:-}" ] && [[ "${ILTERO_CLI_BIN_PATH}" != "${pythonLocation}"/* ]]; then
          echo "::error::Iltero CLI binary ${ILTERO_CLI_BIN_PATH} is outside the expected Python prefix ${pythonLocation}"
          exit 1
        fi

        {
          echo "ILTERO_CLI_BIN<<GHEOF"
          echo "${ILTERO_CLI_BIN_PATH}"
          echo "GHEOF"
        } >> "$GITHUB_ENV"

        # The gate reads the CLI's exit code to decide whether a deployment may
        # proceed, and an older CLI exits cleanly in states where no verdict was
        # reached. Fail closed rather than gate on a signal that is not there.
        "${GITHUB_ACTION_PATH}/../../scripts/cli-floor.sh" enforce-floor

        echo "✅ Iltero CLI installed at ${ILTERO_CLI_BIN_PATH}"

    # -------------------------------------------------------------------------
    # Install Checkov (optional)
    # -------------------------------------------------------------------------
    - name: Install Checkov
      if: inputs.install-checkov == 'true'
      shell: bash
      run: |
        set -euo pipefail

        # Install to a log rather than through a filter. Piping into grep hands
        # the pipeline grep's status, and the `|| true` that silences it then
        # let a failed install be announced below as a successful one — leaving
        # the scanner missing and the run log saying otherwise.
        # Two attempts, two logs: the fallback differs only by
        # --break-system-packages, so the first attempt's reason is usually the
        # real one and must not be overwritten by the second.
        PIP_LOG_1=$(mktemp)
        PIP_LOG_2=$(mktemp)
        if ! python -m pip install --quiet --upgrade --break-system-packages checkov > "${PIP_LOG_1}" 2>&1 &&
           ! python -m pip install --quiet --upgrade checkov > "${PIP_LOG_2}" 2>&1; then
          cat "${PIP_LOG_1}" "${PIP_LOG_2}"
          echo "::error::Checkov install failed"
          exit 1
        fi
        grep -hv "^Requirement\|^Collecting\|^Downloading\|^Using cached\|^Installing" \
          "${PIP_LOG_1}" "${PIP_LOG_2}" || true

        # Checkov performs the static checks, so "pip exited 0" is not enough:
        # confirm the scanner actually runs before anything reports it installed.
        if ! CHECKOV_VERSION=$(checkov --version 2>/dev/null) || [ -z "${CHECKOV_VERSION}" ]; then
          echo "::error::Checkov install reported success but the scanner does not run"
          exit 1
        fi

        echo "✅ Checkov installed"

    # -------------------------------------------------------------------------
    # Install OPA (optional)
    # -------------------------------------------------------------------------
    - name: Install OPA
      if: inputs.install-opa == 'true'
      shell: bash
      env:
        INPUT_OPA_VERSION: ${{ inputs.opa-version }}
      run: |
        set -euo pipefail

        OPA_VERSION="$INPUT_OPA_VERSION"
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # --fail: without it curl writes an error page body to the
        # destination and still exits 0, so an HTTP 404 gets installed as
        # the policy engine and the step below reports success.
        if ! curl -fsSL -o /usr/local/bin/opa \
          "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_${OS}_${ARCH}_static"; then
          echo "::error::Failed to download OPA"
          exit 1
        fi
        chmod +x /usr/local/bin/opa
        if ! opa version > /dev/null 2>&1; then
          echo "::error::OPA was downloaded but does not run"
          exit 1
        fi

        echo "✅ OPA installed"

    # -------------------------------------------------------------------------
    # Configure CLI
    # -------------------------------------------------------------------------
    - name: Configure CLI
      shell: bash
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_API_TOKEN: ${{ inputs.api-token }}
      run: |
        set -euo pipefail
        # =================================================================
        # Disable keyring in CI environments
        # =================================================================
        # In CI, credentials should come from environment variables (secrets)
        # not from system keyring. CI containers don't have keyring backends
        # (D-Bus, gnome-keyring, etc.) so we use the null backend.
        #
        # The null backend makes keyring operations no-ops, preventing
        # errors while ensuring credentials flow through env vars.
        #
        # Security guarantees:
        # - Credentials come from GitHub Secrets -> ILTERO_TOKEN env var
        # - CI containers are ephemeral (no persistent credential storage)
        # - Local dev still uses real keyring for secure credential storage
        # =================================================================
        if [ "${CI:-false}" = "true" ]; then
          echo "PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring" >> "$GITHUB_ENV"
          echo "ℹ️  CI detected: Using null keyring backend (credentials via env vars)"
        fi

        # Resolve API URL: input > existing env var > default
        ILTERO_DEFAULT_API_URL="https://api.iltero.io"
        if [ -n "$INPUT_API_URL" ]; then
          RESOLVED_API_URL="$INPUT_API_URL"
        elif [ -n "${ILTERO_API_URL:-}" ]; then
          RESOLVED_API_URL="$ILTERO_API_URL"
        else
          RESOLVED_API_URL="$ILTERO_DEFAULT_API_URL"
        fi

        # Resolve API token: input > existing env var
        RESOLVED_TOKEN="${INPUT_API_TOKEN:-${ILTERO_TOKEN:-}}"

        # Mask secrets in GitHub Actions logs
        if [ -n "$RESOLVED_TOKEN" ]; then
          echo "::add-mask::$RESOLVED_TOKEN"
        fi
        if [ -n "${ILTERO_REGISTRY_TOKEN:-}" ]; then
          echo "::add-mask::$ILTERO_REGISTRY_TOKEN"
        fi

        # Set environment variables for subsequent steps (heredoc-safe)
        {
          echo "ILTERO_API_URL<<GHEOF"
          echo "$RESOLVED_API_URL"
          echo "GHEOF"
        } >> "$GITHUB_ENV"

        if [ -n "$RESOLVED_TOKEN" ]; then
          {
            echo "ILTERO_TOKEN<<GHEOF"
            echo "$RESOLVED_TOKEN"
            echo "GHEOF"
          } >> "$GITHUB_ENV"
        fi

    # -------------------------------------------------------------------------
    # Verify Installation
    # -------------------------------------------------------------------------
    - name: Verify Installation
      id: verify
      shell: bash
      env:
        INPUT_INSTALL_CHECKOV: ${{ inputs.install-checkov }}
        INPUT_INSTALL_OPA: ${{ inputs.install-opa }}
      run: |
        set -euo pipefail

        echo "Verifying installations..."

        # Verify Iltero CLI
        # Read from the installed package's metadata, which the installer wrote,
        # rather than asking the program to describe itself. "unknown" was
        # previously recorded here as though it were a version, and the step
        # still reported success.
        CLI_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("iltero-cli"))' 2>/dev/null || true)
        if [[ ! "${CLI_VERSION}" =~ ^[0-9A-Za-z.!+-]+$ ]]; then
          echo "::error::Could not read the installed Iltero CLI version from its package metadata"
          exit 1
        fi
        {
          echo "cli-version<<GHEOF"
          echo "${CLI_VERSION}"
          echo "GHEOF"
        } >> "$GITHUB_OUTPUT"
        echo "✅ Iltero CLI: $CLI_VERSION"

        # Verify Checkov
        if [ "$INPUT_INSTALL_CHECKOV" = "true" ]; then
          CHECKOV_VERSION=$(checkov --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
          echo "checkov-version=$CHECKOV_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Checkov: $CHECKOV_VERSION"
        fi

        # Verify OPA
        if [ "$INPUT_INSTALL_OPA" = "true" ]; then
          OPA_VERSION=$(opa version 2>/dev/null | grep -oE 'Version: [0-9]+\.[0-9]+\.[0-9]+' | cut -d' ' -f2 || echo "unknown")
          echo "opa-version=$OPA_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ OPA: $OPA_VERSION"
        fi

        echo ""
        echo "All tools installed successfully!"
