name: Iltero Close Run
description: >-
  Close the governed run of this pipeline run: the change run of a stack and environment, the build run of an
  application, or the image deploy run of an application and environment. List what the run expected and did not
  get.
author: Iltero

branding:
  icon: lock
  color: blue

inputs:
  environment:
    description: >-
      The environment the run deploys to, as given to the deploy, record-iac or record-image action. Alone, it closes
      the stack's change run. With application, it closes the image deploy run.
    required: false
    default: ""
  application:
    description: >-
      The application the run is about, as given to the record-image action. Alone, it closes the build run. With
      environment, it closes the image deploy run.
    required: false
    default: ""
  working-directory:
    description: >-
      The project's directory, relative to the repository root. Its .iltero/config.yml links the project to Iltero
      Platform and names the stack.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/close.sh" check'

    - name: Close the run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        APPLICATION: ${{ inputs.application }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/close.sh" close'
