name: Iltero Close Run
description: Close the Iltero run of this pipeline run for a stack and environment, and list every check it owed and never got.
author: Iltero

branding:
  icon: lock
  color: blue

inputs:
  environment:
    description: The environment the run deploys to, as given to the deploy or record-iac action.
    required: true
  working-directory:
    description: The stack's directory, relative to the repository root. Its .iltero/config.yml names the stack.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/run.sh" check'

    - name: Close the run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/run.sh" close "${ENVIRONMENT}"'
