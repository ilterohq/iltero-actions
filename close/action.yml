name: Iltero Close Run
description: >-
  Close the governed run of this pipeline run: the change run of a stack and environment, or the build run of an
  application. List what the run expected and did not get.
author: Iltero

branding:
  icon: lock
  color: blue

inputs:
  environment:
    description: >-
      The environment the change run deploys to, as given to the deploy or record-iac action. Give exactly one of
      environment and application.
    required: false
    default: ""
  application:
    description: >-
      The application a build run is about, as given to the record-image action. Give exactly one of environment
      and application.
    required: false
    default: ""
  working-directory:
    description: >-
      The project's directory, relative to the repository root. Its .iltero/config.yml links the project to Iltero
      Platform and names the stack.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/close.sh" check'

    - name: Close the run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        APPLICATION: ${{ inputs.application }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/close.sh" close'
