version: 2
updates:
  - package-ecosystem: "github-actions"
    # The workflows ("/") and each composite action pin the actions they use
    # in their own files, so each folder is listed.
    directories:
      - "/"
      - "/setup"
      - "/deploy"
      - "/preview"
      - "/comment"
      - "/record-iac"
      - "/record-image"
      - "/verify"
      - "/close"
    schedule:
      interval: "weekly"
    # A cooldown holds an update back for a few days after publication. That
    # window is when a compromised release is most likely to still be live and
    # unreported, and this repository pins third-party actions by commit, so a
    # bump here changes what runs in every consumer's pipeline. Seven days is
    # the shortest the workflow security linter treats as sufficient.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    # The same third-party action SHAs are inlined across several composite
    # actions. Group bumps into one PR so the inlined copies stay in lockstep.
    groups:
      aws-auth:
        patterns:
          - "aws-actions/configure-aws-credentials"
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
  # The hash-locked Python tools CI installs.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
