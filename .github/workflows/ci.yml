# =============================================================================
# Iltero Actions - CI Pipeline
# =============================================================================
# Quality checks for the iltero-actions repository, and what each one covers:
#   - Workflow linting (actionlint) — .github/workflows and the reference
#     workflows in examples/. It does not read composite action files; yamllint
#     and zizmor check them.
#   - YAML linting (yamllint) — every YAML file in the repository.
#   - Shell script analysis (shellcheck) — scripts/ and tests/test_helper.bash,
#     at style severity.
#   - Shell syntax (bash -n) — scripts/.
#   - Python syntax (py_compile) — every tracked Python file.
#   - NUL bytes — no tracked file holds one.
#   - Behaviour and structure tests (BATS) — tests/.
#   - Secret scanning (TruffleHog) — the whole repository and its history,
#     verified secrets only.
#   - Workflow security analysis (zizmor) — the workflows, the composite
#     actions and the reference workflows.
#   - Markdown linting — the documents named in the job.
#
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Least privilege: each job grants only what it needs.
permissions: {}

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lint: YAML, workflows, shell, Python syntax, NUL bytes, Markdown
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Workflow and YAML linting
      # -----------------------------------------------------------------------
      # Pinned to an exact release and checked against its SHA-256 digest.
      # Update VERSION and SHA256 together. Dependabot does not update them.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          rm -f "${archive}"
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"

      # Lints .github/workflows and examples/. Not in a log group, so the
      # findings show. -verbose prints the version and the files linted.
      - name: Lint GitHub Actions workflows
        run: |
          # actionlint checks run: blocks with shellcheck, and skips that check
          # without failing when shellcheck is missing, so the step first
          # checks that shellcheck is installed.
          command -v shellcheck > /dev/null \
            || { echo "::error::shellcheck not found; actionlint would skip run: block analysis"; exit 1; }
          actionlint -version
          actionlint -color -verbose
          actionlint -color -verbose examples/*/*.yml

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/yamllint.txt'

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml .

      # -----------------------------------------------------------------------
      # Shell Script Linting
      # -----------------------------------------------------------------------
      # --severity=style reports .shellcheckrc's require-variable-braces
      # (SC2250). Not in a log group, so the findings show. shellcheck comes
      # from the runner image; the log shows its version and the files checked.
      - name: Lint Shell Scripts
        run: |
          shellcheck --version
          # An unknown name in .shellcheckrc's enable= is ignored without a
          # failure, so the step checks that the brace rule exists.
          shellcheck --list-optional | grep -q 'require-variable-braces' \
            || { echo "::error::require-variable-braces unavailable in this shellcheck"; exit 1; }
          { find scripts -name '*.sh' -type f; echo tests/test_helper.bash; } | sort
          { find scripts -name '*.sh' -type f; echo tests/test_helper.bash; } | \
            xargs shellcheck --severity=style --format=gcc

      - name: Check Python syntax
        run: git ls-files -z -- '*.py' | xargs -0 -r python -I -m py_compile

      - name: Check that no file holds a NUL byte
        run: git ls-files -z | python -I scripts/find-nul-bytes.py

      # -----------------------------------------------------------------------
      # Markdown Linting
      # -----------------------------------------------------------------------
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            docs/*.md
            examples/*.md
            .github/*.md

  # ===========================================================================
  # Security: secret scanning and workflow security analysis
  # ===========================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # For uploading SARIF

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for secret scanning

      # Scans the repository and its history for secrets, reporting only
      # verified ones.
      - name: Scan for secrets (trufflehog)
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          extra_args: --only-verified

      # Checks the workflows, the composite actions and the reference workflows
      # for security issues, such as untrusted input reaching a command, broad
      # permissions and exposed credentials.
      - name: Scan workflows for security issues
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/zizmor.txt

          # The findings are printed first: the SARIF upload may fail, and the
          # log must still show them.
          rc=0
          echo "::group::zizmor findings"
          zizmor --format plain . examples/*/*.yml || rc=$?
          echo "::endgroup::"

          zizmor --format sarif . examples/*/*.yml > results.sarif || true
          exit "${rc}"

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ===========================================================================
  # Test: Shell script syntax, BATS tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test shell script syntax
        run: |
          echo "::group::Checking bash syntax"
          find scripts -name '*.sh' -type f -print0 | while IFS= read -r -d '' script; do
            echo "Syntax check: ${script}"
            bash -n "${script}"
          done
          echo "::endgroup::"

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run the BATS tests
        run: bats --tap -r tests/
