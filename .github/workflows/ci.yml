# =============================================================================
# Iltero Actions - CI Pipeline
# =============================================================================
# Quality checks for the iltero-actions repository. Each line states what the
# check actually covers, because a check that reads less than its name suggests
# is worse than no check — it reports success over the part it never looked at:
#   - Workflow linting (actionlint) — .github/workflows only. It cannot parse
#     composite action files; those are covered by yamllint and the schema job.
#   - YAML linting (yamllint) — every YAML file in the repository.
#   - Shell script analysis (shellcheck) — scripts/, at style severity, which is
#     the severity the repository's own rules require.
#   - JSON schema validation — the schema files themselves, not configurations
#     written against them.
#   - Secret scanning (TruffleHog) and workflow security analysis (zizmor).
#   - Markdown linting — the five top-level documents named in the job.
#
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Least privilege
permissions:
  contents: read

# Cancel in-progress runs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lint: YAML, Actions, Shell, Markdown
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Action & YAML Linting
      # -----------------------------------------------------------------------
      # Pinned to an exact release and checksum-verified: the upstream installer
      # script lives on a moving branch, and `curl` without `-f` turns a fetch
      # failure into an empty script that `bash` exits 0 on.
      # VERSION and SHA256 are a pair — bump both together, or the build fails
      # closed on a checksum mismatch. Dependabot cannot see either of them.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          rm -f "${archive}"
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"

      # Lints .github/workflows only. Composite action.yml files are not a
      # supported input — actionlint parses them as workflows and reports
      # spurious errors — so their run: bodies remain unlinted.
      # Deliberately ungrouped: a collapsed group would hide the findings.
      # -verbose records the tool version and the files actually linted, so a
      # passing run is distinguishable in the log from one that linted nothing.
      - name: Lint GitHub Actions workflows
        run: |
          # actionlint shells out to shellcheck to analyse run: blocks, and
          # silently skips that analysis — still exiting 0 — when the binary is
          # missing. Assert it is present rather than inheriting it from the
          # runner image. (pyflakes is also optional; no workflow here uses
          # shell: python, so its absence is not asserted.)
          command -v shellcheck > /dev/null \
            || { echo "::error::shellcheck not found; actionlint would skip run: block analysis"; exit 1; }
          actionlint -version
          actionlint -color -verbose

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml .

      # -----------------------------------------------------------------------
      # Shell Script Linting
      # -----------------------------------------------------------------------
      # --severity=style is required for .shellcheckrc's require-variable-braces
      # (SC2250) to be reported at all — at --severity=warning it is filtered
      # out, so the rule .shellcheckrc enables went unenforced.
      # Deliberately ungrouped: a collapsed group would hide the findings.
      # shellcheck comes from the runner image and is not pinned; the version
      # and the file list are printed so a passing run records what it checked.
      - name: Lint Shell Scripts
        run: |
          shellcheck --version
          # An unrecognised name in .shellcheckrc's enable= is ignored silently,
          # which would switch the brace rule back off with CI still green.
          shellcheck --list-optional | grep -q 'require-variable-braces' \
            || { echo "::error::require-variable-braces unavailable in this shellcheck"; exit 1; }
          find scripts -name '*.sh' -type f -print | sort
          find scripts -name '*.sh' -type f -print0 | \
            xargs -0 shellcheck --severity=style --format=gcc

      # -----------------------------------------------------------------------
      # Markdown Linting
      # -----------------------------------------------------------------------
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            SECURITY.md
            CODE_OF_CONDUCT.md

  # ===========================================================================
  # Validate: JSON Schemas, Action Inputs/Outputs consistency
  # ===========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON files
        run: |
          echo "::group::Validating JSON syntax"
          for file in schemas/*.json; do
            echo "Checking $file"
            python3 -m json.tool "$file" > /dev/null
          done
          echo "::endgroup::"

      - name: Validate JSON Schema draft
        run: |
          pip install check-jsonschema
          echo "::group::Validating schema structure"
          check-jsonschema --check-metaschema schemas/config.schema.json
          echo "::endgroup::"

      - name: Check action.yml structure
        run: |
          echo "::group::Checking action definitions have required fields"
          for action in action.yml */action.yml actions/*/action.yml; do
            if [[ -f "$action" ]]; then
              echo "Checking $action"
              # Verify required fields exist
              if ! grep -q "^name:" "$action"; then
                echo "::error file=$action::Missing 'name' field"
                exit 1
              fi
              if ! grep -q "^description:" "$action"; then
                echo "::error file=$action::Missing 'description' field"
                exit 1
              fi
            fi
          done
          echo "::endgroup::"

      - name: Guard against PR review/merge API calls (best-effort)
        run: |
          # The 'pull-requests: write' grant exists only so the action can post
          # an advisory PR comment. Fail if any action reaches for the PR
          # review/approve/merge/base-edit surface that scope also permits.
          # Best-effort static check against first-party YAML (see script header).
          ./scripts/check-comment-api-scope.sh

  # ===========================================================================
  # Security: Secrets detection, dependency review
  # ===========================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # For uploading SARIF

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for secret scanning

      # TruffleHog - Free, open source secret scanner
      # Supports 800+ credential detectors, verification, and entropy analysis
      - name: Scan for secrets (trufflehog)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # main
        with:
          extra_args: --only-verified

      # Dedicated GitHub Actions security linter
      # Catches: injection, pwn requests, excessive permissions, credential exposure
      - name: Scan workflows for security issues
        env:
          ZIZMOR_VERSION: 1.29.0
        run: |
          pip install "zizmor==${ZIZMOR_VERSION}"

          # Print the findings before writing the machine-readable copy. Only
          # the SARIF file was produced before, and its upload is allowed to
          # fail — so a failing scan could leave nothing a reader could act on
          # in either place.
          rc=0
          echo "::group::zizmor findings"
          zizmor --format plain . || rc=$?
          echo "::endgroup::"

          zizmor --format sarif . > results.sarif || true
          exit "${rc}"

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ===========================================================================
  # Test: Shell script syntax and unit tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test shell script syntax
        run: |
          echo "::group::Checking bash syntax"
          find scripts -name '*.sh' -type f -print0 | while IFS= read -r -d '' script; do
            echo "Syntax check: $script"
            bash -n "$script"
          done
          echo "::endgroup::"

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bash unit tests
        run: |
          echo "::group::Running bats tests"
          bats --tap tests/*.bats
          echo "::endgroup::"
