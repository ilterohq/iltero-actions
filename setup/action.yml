name: Iltero Setup
description: >-
  Install the Iltero CLI and its evaluator at pinned, checksum-verified versions.
author: Iltero

branding:
  icon: shield
  color: blue

outputs:
  cli-commit:
    description: The Iltero CLI commit installed.
    value: ${{ steps.cli.outputs.cli-commit }}
  cli-path:
    description: Absolute path of the Iltero CLI.
    value: ${{ steps.cli.outputs.cli-path }}
  evaluator-path:
    description: Absolute path of the evaluator, the policy engine that runs the assertions.
    value: ${{ steps.cli.outputs.evaluator-path }}

runs:
  using: composite
  steps:
    - name: Check the event and the runner
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/setup.sh" check'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install the Iltero CLI
      id: cli
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/setup.sh" cli'
