name: Iltero Record IaC
description: Record one stage of a unit's Terraform change, in the job that runs Terraform.
author: Iltero

branding:
  icon: check-circle
  color: blue

inputs:
  stage:
    description: >-
      The stage to record: plan (after terraform plan), pre_deploy (before terraform apply), post_deploy (after
      terraform apply, also when the apply failed) or post_verify (after post_deploy, a check that the deployed
      resources still match what the apply left). A tracked run expects pre_deploy unless the environment's policy
      leaves it out. A tracked run to a production environment always expects it. Record it before post_deploy.
      Otherwise post_deploy records the apply and then fails. In a tracked run, record post_deploy in the job that
      recorded pre_deploy. At pre_deploy, record-iac stops when records-directory holds no record of the unit. In a
      project not linked to Iltero Platform, it then asks the CLI whether the unit's record from plan requires the
      stage. When the record does not require it, record-iac checks nothing and reports not required. In a linked
      project, when the check at pre_deploy or post_verify passes, record-iac asks the CLI whether the unit's record
      requires the stage, and reports not required when it does not. On pull_request events, record-iac records only
      plan, and checks it locally. record-iac refuses pull request review events.
    required: true
  environment:
    description: The environment the change deploys to.
    required: true
  unit:
    description: The unit's name, as `iltero units list` prints it.
    required: true
  project-directory:
    description: The project's directory, relative to the repository root. File inputs are relative to it.
    required: false
    default: "."
  plan:
    description: >-
      The saved plan as JSON, from `terraform show -json`. Required at plan and post_deploy. Optional at pre_deploy in
      a project linked to Iltero Platform. There it names the plan rendered from the file in saved-plan. The CLI
      refuses a plan other than the one the plan stage checked. A job that applies a plan made in an earlier job must
      give plan, saved-plan and replan. Leave it empty at post_verify, and at pre_deploy in a project not linked to
      Iltero Platform.
    required: false
    default: ""
  saved-plan:
    description: >-
      The saved plan file, from `terraform plan -out`. Required at plan and post_deploy. Optional at pre_deploy in a
      project linked to Iltero Platform. There it names the saved plan file this job will apply, and plan names the
      plan rendered from it. The CLI refuses a file other than the one the plan stage checked. A job that applies a
      plan made in an earlier job must give plan, saved-plan and replan. Leave it empty at post_verify, and at
      pre_deploy in a project not linked to Iltero Platform.
    required: false
    default: ""
  replan:
    description: >-
      Only at pre_deploy, in a project linked to Iltero Platform. A new plan as JSON, made in the job that applies,
      just before pre_deploy: run `terraform plan -out=FILE` with the same configuration and variables as the plan,
      then `terraform show -json FILE`. Terraform dates a plan to the second, and the CLI refuses a new plan that is
      not newer than the checked plan, or that was made after pre_deploy started. So start the new plan at least one
      second after the plan finished. Keep both files in the runner's temporary directory, apart from the saved plan,
      and never apply them. The CLI compares the new plan with the checked plan and records only the result. A job
      that applies a plan made in an earlier job must give it, with plan and saved-plan. replan needs plan. Leave it
      empty at the other stages, and at pre_deploy in a project not linked to Iltero Platform.
    required: false
    default: ""
  scan-reports:
    description: >-
      Plan only. Reports of scanners, tools that check the plan for security problems. One per line: the scanner
      (checkov or trivy), a space, then the path of its JSON report. At most one report for each scanner. Scan the
      file the plan input names, and write each scanner's JSON output to a file of its own. For Checkov: `checkov -f
      PLAN --framework terraform_plan --output json --soft-fail > checkov.json`. `--soft-fail` keeps a failed check
      from failing the scan step, so the CLI gives the verdict. Never add `--quiet`, which leaves out the checks that
      passed. For Trivy: `trivy config --include-non-failures --skip-check-update --format json PLAN > trivy.json`.
      `--skip-check-update` keeps the checks that come with the Trivy release, so a plan is checked the same way each
      time. Run each scanner where it cannot reach the job's files or cloud credentials.
      examples/iac/own-terraform.yml runs each scanner in a container with no network and only the plan mounted. Set
      it only in a project not linked to Iltero Platform, or on pull_request events. In a linked project, on any other
      event, the CLI refuses the reports and the step fails: the run's settings on Iltero Platform decide which checks
      run. Leave it empty at the other stages.
    required: false
    default: ""
  apply-log:
    description: >-
      The output of `terraform apply -json` of the saved plan. Required at post_deploy. Leave it empty at the other
      stages.
    required: false
    default: ""
  state:
    description: >-
      The state after the apply, from `terraform show -json`. Required at post_deploy, unless state-unreadable is
      true. Required at post_verify too: give the same file that post_deploy took, so the CLI can finish the checks
      the plan stage left until after the apply. Leave it empty at plan and pre_deploy.
    required: false
    default: ""
  state-unreadable:
    description: >-
      true or false. For the post_deploy stage only. Set it to true when `terraform show -json` could not read the
      state after the apply, and leave state empty. The CLI then records the apply from the apply log alone, and the
      step fails.
    required: false
    default: "false"
  refresh-only-plans:
    description: >-
      The two readings of the deployed resources, as JSON, one path per line, in the order they were taken. Required
      at post_verify. Leave it empty at the other stages. A reading is a refresh-only plan: Terraform reads the
      deployed resources and changes nothing. Make each with `terraform plan -refresh-only -out=FILE`, then
      `terraform show -json FILE`. Take the second at least 60 seconds after the first. Drift is a difference between
      a deployed resource and what the apply left. The second reading shows whether a difference lasts. Never run
      `terraform apply -refresh-only`: it writes what it reads into the state, so drift no longer shows.
    required: false
    default: ""
  records-directory:
    description: >-
      Where the CLI keeps the records. When it is empty, the action uses a directory of its own for each environment
      and project-directory, under the runner's temporary directory. Every stage of the stack in that environment uses
      it, so give every stage the same project-directory. A relative path is relative to project-directory. pre_deploy
      reads the plan stage's record from it, and the step stops when it holds no record of the unit. When pre_deploy
      runs in a different job from plan, download the plan job's records artifact and pass its directory here. That
      job must also give the saved-plan, plan and replan inputs. saved-plan names the saved plan file the job will
      apply, plan names the plan rendered from it with `terraform show -json`, and replan names the new plan the job
      makes just before pre_deploy.
    required: false
    default: ""
  write-report:
    description: >-
      true or false. When true, the CLI writes a report of the unit's record for a person to read, as an HTML
      page and as Markdown. The action uploads both as the artifact <artifact-name>-report and adds the Markdown
      to the job summary. When the CLI does not write both files, the step fails at its end.
    required: false
    default: "true"
  store-records:
    description: >-
      true or false. When true, the CLI keeps the stage's record and every file it cites in the run's artifact store,
      the bucket that Iltero Platform names for the run, with the job's own cloud credentials. Set it to true only in
      a project linked to Iltero Platform. It has no effect on pull_request events. A failed store fails the
      step.
    required: false
    default: "false"
  artifact-name:
    description: >-
      Name of the artifact that holds the records. The action adds -attempt-<attempt> to the name, where <attempt>
      is the pipeline run's attempt number, so a re-run keeps the records of earlier attempts. When the input is
      empty, the name is iltero-records-<environment>-<unit>-attempt-<attempt>. The artifact-name output gives the
      full name. Each step replaces the artifact with the records in records-directory, so two jobs that record
      the same environment and unit from different records directories need different names.
    required: false
    default: ""

  retention-days:
    description: >-
      The number of days GitHub keeps the artifacts this action uploads, a whole number of 1 or more. When the
      input is empty, the repository's own artifact retention setting applies.
    required: false
    default: ""

  operator-trust-file:
    description: >-
      The path of an operator trust file, which lists the signing keys of a self-hosted Iltero Platform. A relative
      path is relative to project-directory. The action gives the file to the CLI, which reads it only when it
      checks something that server signed, such as the assertion bundle of a tracked run. When the CLI refuses the
      file, the step fails. The step stops before it runs the CLI when the path names no file or holds a control
      character. When the input is empty, the action gives the CLI no operator trust file, even one the job set
      some other way. Leave it empty for the hosted Iltero Platform.
    required: false
    default: ""

outputs:
  records-directory:
    description: The directory that holds the records.
    value: ${{ steps.record.outputs.records-directory }}
  report-directory:
    description: The directory that holds the reports. Empty when write-report is false.
    value: ${{ steps.record.outputs.report-directory }}
  artifact-name:
    description: The name of the artifact that holds the records.
    value: ${{ steps.record.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        RETENTION_DAYS: ${{ inputs.retention-days }}
        STAGE: ${{ inputs.stage }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/record.sh" check "${STAGE}"'

    - name: Record the stage
      id: record
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        STAGE: ${{ inputs.stage }}
        ENVIRONMENT: ${{ inputs.environment }}
        UNIT: ${{ inputs.unit }}
        PLAN: ${{ inputs.plan }}
        SAVED_PLAN: ${{ inputs.saved-plan }}
        REPLAN: ${{ inputs.replan }}
        SCAN_REPORTS: ${{ inputs.scan-reports }}
        APPLY_LOG: ${{ inputs.apply-log }}
        STATE: ${{ inputs.state }}
        STATE_UNREADABLE: ${{ inputs.state-unreadable }}
        REFRESH_ONLY_PLANS: ${{ inputs.refresh-only-plans }}
        RECORDS_DIRECTORY: ${{ inputs.records-directory }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        WRITE_REPORT: ${{ inputs.write-report }}
        STORE_RECORDS: ${{ inputs.store-records }}
        OPERATOR_TRUST_FILE: ${{ inputs.operator-trust-file }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/record.sh" run "${STAGE}"'

    - name: Upload the records
      if: always() && steps.record.outputs.records-directory != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.record.outputs.artifact-name }}
        path: ${{ steps.record.outputs.records-directory }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
        overwrite: true

    - name: Upload the reports
      if: always() && steps.record.outputs.report-directory != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.record.outputs.artifact-name }}-report
        path: ${{ steps.record.outputs.report-directory }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
        overwrite: true
