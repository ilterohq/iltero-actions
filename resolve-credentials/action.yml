# =============================================================================
# ilterohq/iltero-actions/resolve-credentials
# =============================================================================
# Resolves the cloud credential bound to a (workspace, environment) and
# configures the runner for terraform / aws-cli. Performs a CLI lookup for
# the role ARN and region, then hands off to aws-actions/configure-aws-credentials
# for the OIDC + STS exchange. Per-workflow-run scope: one call covers all
# stacks in the run because the binding is per-(workspace, environment).
#
# Requires:
#   - ilterohq/iltero-actions/setup has run (provides iltero CLI,
#     ILTERO_TOKEN, ILTERO_API_URL).
#   - Calling job grants `permissions: { id-token: write }`.
#
# Usage (workspace-id — preferred for generated workflows):
#   - uses: ilterohq/iltero-actions/setup@RELEASE_COMMIT_SHA # v0.2.0
#   - uses: ilterohq/iltero-actions/resolve-credentials@RELEASE_COMMIT_SHA # v0.2.0
#     with:
#       workspace-id: 0b278217-a809-465a-b9df-00eda8414cb8
#       environment: production
#   - uses: ilterohq/iltero-actions/deploy@RELEASE_COMMIT_SHA # v0.2.0
#     with: { stack-id: ..., environment: ..., ... }
#
# Usage (stack-id — for hand-authored workflows):
#   - uses: ilterohq/iltero-actions/resolve-credentials@RELEASE_COMMIT_SHA # v0.2.0
#     with:
#       stack-id: 0b278217-a809-465a-b9df-00eda8414cb8
#       environment: production
# =============================================================================

name: Iltero Resolve CI Credentials
description: Look up the per-(workspace, environment) cloud role and configure cloud auth.
author: Iltero

branding:
  icon: lock
  color: blue

inputs:
  workspace-id:
    description: |
      Iltero workspace UUID. Stable identifier for generated workflow YAML —
      prefer this over stack-id when the workflow is generated by the backend.
      Mutually exclusive with stack-id; exactly one must be set.
    required: false

  stack-id:
    description: |
      Iltero stack UUID. Use this in hand-authored workflows where you have a
      specific stack UUID from config.yml or the dashboard.
      Mutually exclusive with workspace-id; exactly one must be set.
    required: false

  environment:
    description: |
      Target environment key (matches an environment in your stack's config.yml).
      Optional: when omitted, it is detected from the stack config.yml git_ref
      mapping (a workspace invariant, so all matching stacks must agree).
    required: false
    default: ''

  stacks-config:
    description: |
      Path to the stacks metadata directory, used for environment detection when
      `environment` is not provided. Default: .iltero/stacks.
    required: false
    default: '.iltero/stacks'

  role-duration-seconds:
    description: |
      STS session duration (seconds) for the assumed role. Default 900. Generated
      workflows pass a larger value (e.g. 3600) to cover a multi-unit run; the
      role's MaxSessionDuration must be at least this value.
    required: false
    default: '900'

outputs:
  environment:
    description: |
      Resolved environment key. Empty when no environment mapped to the current
      branch and credential resolution was skipped.
    value: ${{ steps.resolve.outputs.environment }}
  provider:
    description: Cloud provider that was resolved (e.g. 'aws'). Empty when skipped.
    value: ${{ steps.resolve.outputs.provider }}
  role-arn:
    description: AWS IAM role ARN (when provider=aws).
    value: ${{ steps.resolve.outputs.role-arn }}
  region:
    description: AWS region (when provider=aws).
    value: ${{ steps.resolve.outputs.region }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Look up the cloud principal via the Iltero CLI.
    # -------------------------------------------------------------------------
    - name: Resolve cloud principal
      id: resolve
      shell: bash
      env:
        WORKSPACE_ID: ${{ inputs.workspace-id }}
        STACK_ID: ${{ inputs.stack-id }}
        ENVIRONMENT: ${{ inputs.environment }}
        STACKS_CONFIG: ${{ inputs.stacks-config }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # shellcheck source=../scripts/lib/iltero-core/index.sh
        source "${ACTION_PATH}/../scripts/lib/iltero-core/index.sh"

        # XOR: exactly one of workspace-id or stack-id must be provided.
        if [[ -n "${WORKSPACE_ID}" && -n "${STACK_ID}" ]]; then
          echo "::error::Provide workspace-id or stack-id, not both."
          exit 1
        fi
        if [[ -z "${WORKSPACE_ID}" && -z "${STACK_ID}" ]]; then
          echo "::error::One of workspace-id or stack-id is required."
          exit 1
        fi

        # Environment: an explicit input wins; otherwise resolve it from the stack
        # config git_ref mapping via the CLI (`iltero environment detect` — local,
        # no yq dependency in this credential step). Exit code is the contract, and
        # the env key is the ONLY thing on stdout (diagnostics go to stderr):
        #   0 = matched (env key on stdout), 3 = no match (benign skip),
        #   2 (or any other non-zero) = error (fail closed).
        resolved_env="${ENVIRONMENT}"
        if [[ -z "${resolved_env}" ]]; then
          detect_rc=0
          resolved_env=$("${ILTERO_CLI_BIN:-iltero}" environment detect \
            --stacks-config "${STACKS_CONFIG}") || detect_rc=$?
          if [[ "${detect_rc}" -eq 3 ]]; then
            echo "::notice::No environment maps to this branch — skipping cloud credential resolution."
            {
              echo "environment="
              echo "provider="
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${detect_rc}" -ne 0 || -z "${resolved_env}" ]]; then
            echo "::error::Could not detect environment from ${STACKS_CONFIG} (iltero environment detect exit ${detect_rc}). Check config.yml."
            exit 1
          fi
        fi

        # Defense-in-depth: resolved_env is written to $GITHUB_OUTPUT below; reject
        # a newline so a stray value can't inject a forged output line, independent
        # of resolve_ci_credential's own env-key validation.
        if [[ "${resolved_env}" == *$'\n'* ]]; then
          echo "::error::Resolved environment contains an unexpected newline."
          exit 1
        fi

        if [[ -n "${WORKSPACE_ID}" ]]; then
          resolve_ci_credential --workspace-id "${WORKSPACE_ID}" "${resolved_env}"
        else
          resolve_ci_credential --stack-id "${STACK_ID}" "${resolved_env}"
        fi

        case "${CI_CREDENTIAL_PROVIDER}" in
          aws)
            {
              echo "environment=${resolved_env}"
              echo "provider=aws"
              echo "role-arn=${CI_CREDENTIAL_AWS_ROLE_ARN}"
              echo "region=${CI_CREDENTIAL_AWS_REGION}"
            } >> "${GITHUB_OUTPUT}"
            ;;
          # Forward-compat guard: resolve_ci_credential only returns 'aws'
          # on success today (other providers exit non-zero above, aborting
          # this step under `set -e`). This arm catches a future provider
          # added to the resolver but not yet wired through here.
          *)
            echo "::error::Unsupported cloud provider '${CI_CREDENTIAL_PROVIDER}' returned by resolve_ci_credential"
            exit 1
            ;;
        esac

    # -------------------------------------------------------------------------
    # Configure AWS credentials. The official Action does the OIDC fetch +
    # STS AssumeRoleWithWebIdentity and writes AWS_* to $GITHUB_ENV.
    # -------------------------------------------------------------------------
    - name: Configure AWS credentials
      if: steps.resolve.outputs.provider == 'aws'
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: ${{ steps.resolve.outputs.role-arn }}
        aws-region: ${{ steps.resolve.outputs.region }}
        # Session assumed once per job; sized by the caller to cover the whole
        # run (default 900s). Must be <= the role's MaxSessionDuration.
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
