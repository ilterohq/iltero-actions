# =============================================================================
# ilterohq/iltero-actions
# =============================================================================
# High-level orchestrator for complete infrastructure compliance pipelines.
#
# This is the recommended action for most users. It handles:
#   - Automatic environment detection from branch
#   - Automatic stack detection from changed files
#   - Sequential unit processing with dependency ordering
#   - Static scanning (Checkov) and plan evaluation (OPA)
#   - Result submission to Iltero
#
# Usage (OIDC — recommended for push/deploy):
#   - uses: ilterohq/iltero-actions@v1
#     with:
#       stacks_path: infra/stacks
#       stacks_config: .iltero/stacks
#       oidc: 'true'
#       org_id: ${{ vars.ILTERO_ORG_ID }}
#
# PR-Preview (bearer — advisory scan on pull requests):
#   - uses: ilterohq/iltero-actions@v1
#     with:
#       mode: preview
#       stacks_path: infra/stacks
#       stacks_config: .iltero/stacks
#       org_id: ${{ vars.ILTERO_ORG_ID }}
#     env:
#       ILTERO_TOKEN: ${{ secrets.ILTERO_TOKEN }}
#
# For granular control, use individual actions:
#   - ilterohq/iltero-actions/setup@v1
#   - ilterohq/iltero-actions/configure-registry@v1
#   - ilterohq/iltero-actions/scan@v1
#   - ilterohq/iltero-actions/evaluate@v1
# =============================================================================

name: Iltero Pipeline
description: Configuration-driven compliance scanning and deployment for Terraform
author: Iltero

branding:
  icon: shield
  color: blue

inputs:
  stacks_path:
    description: |
      Path to stacks code directory (greenfield stacks).
      Contains user-authored Terraform units: <stacks_path>/<slug>/units/...
      If not provided, the action checks for .iltero/config.yml (brownfield).
      Example: 'infra/stacks'
    required: false
    default: ''

  stacks_config:
    description: |
      Path to stacks metadata directory (greenfield stacks).
      Contains tool-owned per-stack config and runtime artefacts:
      <stacks_config>/<slug>/{config.yml, results.json, state-status/}
      Example: '.iltero/stacks'
    required: false
    default: '.iltero/stacks'

  config_path:
    description: |
      Path to brownfield config file relative to repository root.
      Used when stacks_path is not set. Default: '.iltero/config.yml'
    required: false
    default: '.iltero/config.yml'

  environment:
    description: |
      Override environment detection. If not provided, the environment is
      automatically detected from the current branch by matching against
      git_ref.name in each environment's config.yml.
      Example: 'production', 'staging', 'development'
    required: false
    default: ''

  stack:
    description: |
      Specific stack to process. If not provided, stacks are automatically
      detected from changed files in the commit/PR.
      Example: 'my-infrastructure'
    required: false
    default: ''

  mode:
    description: |
      Pipeline mode:
        full           — scan + evaluate + submit + deploy (default)
        preview        — PR-preview: scan + evaluate locally, NO submission,
                         NO deploy. Uses ILTERO_TOKEN bearer; OIDC is not used.
        scan           — static scan only, submit results, no deploy
        evaluate       — plan evaluation only, submit results, no deploy
        scan_evaluate  — scan + evaluate + submit, no deploy
        deploy         — deploy only (requires run_id from prior compliance job)
    required: false
    default: 'full'

  run_id:
    description: |
      Existing Iltero run ID to chain to (from compliance job).
      Required when mode is 'deploy'.
    required: false
    default: ''

  terraform_version:
    description: |
      Terraform version to install (accepts an exact version, `latest`, a
      Terraform constraint like `~> 1.11`, or a semver range). Overrides
      terraform.version in config.yml. When empty, the version is taken from
      config.yml, falling back to the newest 1.10.x patch. Iltero requires
      Terraform >= 1.10 (S3 native state locking).
    required: false
    default: ''

  verify_authorization:
    description: |
      If true, verify deployment authorization via Iltero backend.
      When enabled, deploys will fail if the run hasn't been approved.
    required: false
    default: 'true'

  attest:
    description: |
      Enable plan-to-apply provenance (on by default). The deploy applies the
      EXACT evaluated plan and the backend enforces it at the deploy gate
      (anti-substitution). Units that can't be bound (e.g. non-S3 backend)
      degrade gracefully and are reported as not bound. Set to 'false' to
      restore the legacy re-plan-at-apply behaviour. See docs/provenance.md.
    required: false
    default: 'true'

  s3_sse:
    description: |
      Server-side encryption mode for plan artifacts in the backend bucket
      (e.g. AES256 or aws:kms). Defaults to the bucket's default encryption.
    required: false
    default: ''

  debug:
    description: |
      Enable debug output for troubleshooting.
    required: false
    default: 'false'

  registry_host:
    description: |
      Hostname of Iltero's private Terraform module registry.
      Used with ILTERO_REGISTRY_TOKEN to configure git credentials.
      Default: 'registry.iltero.io'
    required: false
    default: 'registry.iltero.io'

  oidc:
    description: |
      Enable OIDC authentication. When true, the pipeline exchanges a
      GitHub Actions OIDC token for short-lived Iltero tokens per stack
      (using stack.id from each stack's config.yml). Requires org_id.
    required: false
    default: 'false'

  org_id:
    description: |
      Iltero Organization ID (required when oidc is true).
      Set as a repository variable: vars.ILTERO_ORG_ID
    required: false
    default: ''

  comment_on_pr:
    description: |
      Post an advisory comment summarizing the result on pull_request runs.
      Requires the job to grant 'pull-requests: write'. Set to 'false' if you
      post your own comment from a separate job to avoid a duplicate comment.
    required: false
    default: 'true'

outputs:
  stacks_processed:
    description: JSON array of stacks that were processed
    value: ${{ steps.pipeline.outputs.stacks_processed }}

  overall_status:
    description: |
      Overall pipeline status.
      Values: success, static_scan_failed, evaluation_failed, authorization_failed, deploy_failed, skipped
    value: ${{ steps.pipeline.outputs.overall_status }}

  static_scan_passed:
    description: Whether all static scans passed (true/false)
    value: ${{ steps.pipeline.outputs.static_scan_passed }}

  evaluation_passed:
    description: Whether all plan evaluations passed (true/false)
    value: ${{ steps.pipeline.outputs.evaluation_passed }}

  authorization_passed:
    description: Whether deployment authorization passed (true/false, only in deploy mode)
    value: ${{ steps.pipeline.outputs.authorization_passed }}

  environment:
    description: The environment that was detected or used
    value: ${{ steps.pipeline.outputs.environment }}

  terraform_version:
    description: |
      The concrete Terraform version that was installed and used (a range or
      `latest` resolves to a specific patch). Recorded for the audit trail.
    value: ${{ steps.setup.outputs.terraform-version }}

  run_id:
    description: Iltero run ID for workflow chaining
    value: ${{ steps.pipeline.outputs.run_id }}

  require_approval:
    description: |
      Whether deployment requires manual approval (from config.yml).
      If true, you must use a separate deployment job with GitHub
      environment protection for actual deployments.
    value: ${{ steps.pipeline.outputs.require_approval }}

  approval_id:
    description: |
      Iltero approval ID (when require_approval is true).
    value: ${{ steps.pipeline.outputs.approval_id }}

  compliance_only:
    description: |
      Whether the pipeline ran in compliance-only mode (no deployment).
      True when mode is preview, scan, evaluate, or scan_evaluate,
      and also for pull_request events regardless of mode.
    value: ${{ steps.pipeline.outputs.compliance_only }}

  deployment_ready:
    description: |
      Whether the pipeline passed and deployment can proceed.
      Use this to conditionally run deployment jobs.
    value: ${{ steps.pipeline.outputs.deployment_ready }}

  unit_results:
    description: |
      JSON array of per-unit scan/evaluation/deploy results.
      Each entry has: unit, scan, evaluation, deploy objects with
      passed/skipped/violations fields. Use for custom reporting.
    value: ${{ steps.pipeline.outputs.unit_results }}

  severity_threshold:
    description: |
      The fail-on severity threshold applied this run (from the
      environment's config.yml). Findings at or above it block the gate.
    value: ${{ steps.pipeline.outputs.severity_threshold }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Sanitize inputs. Every subsequent step assumes these are well-formed.
    # -------------------------------------------------------------------------
    - name: Sanitize Inputs
      shell: bash
      env:
        INPUT_ORG_ID: ${{ inputs.org_id }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_STACK: ${{ inputs.stack }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OIDC: ${{ inputs.oidc }}
        INPUT_STACKS_PATH: ${{ inputs.stacks_path }}
        INPUT_STACKS_CONFIG: ${{ inputs.stacks_config }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        # pull_request_target runs with write-scoped GITHUB_TOKEN against
        # base-branch workflow code + PR-author inputs. Refuse to run —
        # SECURITY.md marks this trigger unsupported; this enforces it.
        case "${EVENT_NAME}" in
          pull_request_target)
            echo "::error::ilterohq/iltero-actions does not support pull_request_target triggers. See SECURITY.md."
            exit 1
            ;;
        esac

        fail() {
          echo "::error::Invalid input: $1"
          exit 1
        }

        # Mode enum validation
        case "${INPUT_MODE}" in
          full|preview|scan|evaluate|scan_evaluate|deploy) ;;
          *) fail "mode must be one of: full, preview, scan, evaluate, scan_evaluate, deploy" ;;
        esac

        # preview mode is bearer-only; OIDC is structurally incompatible
        if [[ "${INPUT_MODE}" == "preview" && "${INPUT_OIDC}" == "true" ]]; then
          fail "mode=preview cannot be used with oidc=true (preview uses bearer auth)"
        fi

        # Optional UUID fields (empty = unset → OK)
        uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        if [[ -n "${INPUT_ORG_ID:-}" && ! "${INPUT_ORG_ID}" =~ $uuid_re ]]; then
          fail "org_id must be a UUID"
        fi
        if [[ -n "${INPUT_RUN_ID:-}" && ! "${INPUT_RUN_ID}" =~ $uuid_re ]]; then
          fail "run_id must be a UUID"
        fi

        # Environment / stack slug — lowercase alnum + _ - (slugs).
        slug_re='^[a-z][a-z0-9_-]{0,63}$'
        if [[ -n "${INPUT_ENVIRONMENT:-}" && ! "${INPUT_ENVIRONMENT}" =~ $slug_re ]]; then
          fail "environment must match ${slug_re}"
        fi
        if [[ -n "${INPUT_STACK:-}" && ! "${INPUT_STACK}" =~ $slug_re ]]; then
          fail "stack must match ${slug_re}"
        fi

        # Path inputs — relative only, no ``..`` segments, no leading slash,
        # no shell metacharacters. The runner ``cd``s into these, and the
        # backend compares them against repo contents — a traversal would
        # either escape the checkout dir or confuse diff computation.
        reject_path() {
          local name="$1"
          local value="$2"
          if [[ -z "${value}" ]]; then return 0; fi
          case "${value}" in
            /*|*..*|*'$'*|*'`'*|*'*'*|*'?'*|*'['*) fail "${name} must be a simple relative path" ;;
          esac
          if [[ ! "${value}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            fail "${name} contains disallowed characters"
          fi
        }
        reject_path stacks_path "${INPUT_STACKS_PATH:-}"
        reject_path stacks_config "${INPUT_STACKS_CONFIG:-}"
        reject_path config_path "${INPUT_CONFIG_PATH:-}"

    # =========================================================================
    # SETUP: Install all tools (inlined from setup/, actions/setup-toolchain/,
    #        and actions/setup-iltero-cli/ to avoid nested composite action
    #        path resolution issues when consumed remotely)
    # =========================================================================

    # -------------------------------------------------------------------------
    # Install yq
    # -------------------------------------------------------------------------
    - name: Install yq
      shell: bash
      run: |
        set -euo pipefail

        YQ_VERSION="v4.35.2"
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}" -o /tmp/yq 2>&1 | grep -v "^  %\|^Dload\|^Total" || true
        sudo mv /tmp/yq /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq

        echo "  yq installed"

    # -------------------------------------------------------------------------
    # Install jq
    # -------------------------------------------------------------------------
    - name: Install jq
      shell: bash
      run: |
        set -euo pipefail

        if command -v jq &> /dev/null; then
          exit 0
        fi

        JQ_VERSION="1.7"
        ARCH=$(uname -m)

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        curl -sSL "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-${ARCH}" -o /tmp/jq 2>&1 | grep -v "^  %\|^Dload\|^Total" || true
        sudo mv /tmp/jq /usr/local/bin/jq
        sudo chmod +x /usr/local/bin/jq

        echo "  jq installed"

    # -------------------------------------------------------------------------
    # Resolve Terraform version
    # -------------------------------------------------------------------------
    # Runs BEFORE the install so the version can come from config.yml: detection
    # is git + YAML only (no Terraform binary needed). Precedence: action input
    # > config.yml terraform.version > default (~1.10). Fails closed if selected
    # stacks pin different versions. Needs yq/jq, installed above.
    - name: Resolve Terraform version
      id: resolve-tf
      shell: bash
      env:
        INPUT_TERRAFORM_VERSION: ${{ inputs.terraform_version }}
        STACKS_PATH: ${{ inputs.stacks_path }}
        STACKS_CONFIG: ${{ inputs.stacks_config }}
        CONFIG_PATH: ${{ inputs.config_path }}
        STACK: ${{ inputs.stack }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "${ACTION_PATH}/scripts/terraform-version.sh" resolve

    # -------------------------------------------------------------------------
    # Setup Terraform
    # -------------------------------------------------------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.resolve-tf.outputs.terraform-version }}
        terraform_wrapper: false

    # -------------------------------------------------------------------------
    # Enforce Terraform version floor
    # -------------------------------------------------------------------------
    # Checks the CONCRETE installed version (resolution above may accept a
    # range). Iltero requires >= 1.10 for S3 native state locking; fails closed
    # below it. Needs jq, installed above.
    - name: Enforce Terraform version floor
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "${ACTION_PATH}/scripts/terraform-version.sh" enforce-floor

    # -------------------------------------------------------------------------
    # Install Python dependencies
    # -------------------------------------------------------------------------
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip3 install --user --break-system-packages pyyaml jsonschema 2>/dev/null || \
          pip3 install --user pyyaml jsonschema
        echo "  Python dependencies installed"

    # -------------------------------------------------------------------------
    # Setup Python
    # -------------------------------------------------------------------------
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    # -------------------------------------------------------------------------
    # Install Iltero CLI
    # -------------------------------------------------------------------------
    - name: Install Iltero CLI
      shell: bash
      run: |
        set -euo pipefail
        pip install --quiet --upgrade iltero-cli 2>&1 | grep -v "^Requirement\|^Collecting\|^Downloading\|^Using cached\|^Installing" || true
        echo "  Iltero CLI installed"

    # -------------------------------------------------------------------------
    # Install Checkov
    # -------------------------------------------------------------------------
    - name: Install Checkov
      shell: bash
      run: |
        set -euo pipefail
        pip install --quiet --upgrade --break-system-packages checkov 2>&1 | grep -v "^Requirement\|^Collecting\|^Downloading\|^Using cached\|^Installing" || \
          pip install --quiet --upgrade checkov 2>&1 | grep -v "^Requirement\|^Collecting\|^Downloading\|^Using cached\|^Installing" || true
        echo "  Checkov installed"

    # -------------------------------------------------------------------------
    # Install OPA
    # -------------------------------------------------------------------------
    - name: Install OPA
      shell: bash
      run: |
        set -euo pipefail

        OPA_VERSION="0.60.0"
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        curl -sSL -o /usr/local/bin/opa \
          "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_${OS}_${ARCH}_static" 2>&1 | grep -v "^  %\|^Dload\|^Total" || true
        chmod +x /usr/local/bin/opa

        echo "  OPA installed"

    # -------------------------------------------------------------------------
    # Configure CLI (keyring, API URL, token masking)
    # -------------------------------------------------------------------------
    - name: Configure CLI
      shell: bash
      run: |
        set -euo pipefail

        # Disable keyring in CI (credentials come from env vars / secrets)
        if [ "${CI:-false}" = "true" ]; then
          echo "PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring" >> "$GITHUB_ENV"
          echo "  CI detected: using null keyring backend (credentials via env vars)"
        fi

        # Resolve API URL: existing env var > default
        ILTERO_DEFAULT_API_URL="https://api.iltero.io"
        if [ -n "${ILTERO_API_URL:-}" ]; then
          RESOLVED_API_URL="$ILTERO_API_URL"
        else
          RESOLVED_API_URL="$ILTERO_DEFAULT_API_URL"
        fi

        # Resolve API token from env var
        RESOLVED_TOKEN="${ILTERO_TOKEN:-}"

        # Mask secrets in GitHub Actions logs
        if [ -n "$RESOLVED_TOKEN" ]; then
          echo "::add-mask::$RESOLVED_TOKEN"
        fi
        if [ -n "${ILTERO_REGISTRY_TOKEN:-}" ]; then
          echo "::add-mask::$ILTERO_REGISTRY_TOKEN"
        fi

        # Set environment variables for subsequent steps (heredoc-safe)
        {
          echo "ILTERO_API_URL<<GHEOF"
          echo "$RESOLVED_API_URL"
          echo "GHEOF"
        } >> "$GITHUB_ENV"
        echo "  API URL: $RESOLVED_API_URL"

        if [ -n "$RESOLVED_TOKEN" ]; then
          {
            echo "ILTERO_TOKEN<<GHEOF"
            echo "$RESOLVED_TOKEN"
            echo "GHEOF"
          } >> "$GITHUB_ENV"
        fi

    # -------------------------------------------------------------------------
    # Verify Installation
    # -------------------------------------------------------------------------
    - name: Verify Installation
      id: setup
      shell: bash
      run: |
        set -euo pipefail

        echo "  Installation Summary:"

        CLI_VERSION=$(iltero --version 2>/dev/null || echo "not installed")
        echo "   Iltero CLI: $CLI_VERSION"

        CHECKOV_VERSION=$(checkov --version 2>/dev/null || echo "not installed")
        echo "   Checkov: $CHECKOV_VERSION"

        OPA_VERSION=$(opa version 2>/dev/null | head -1 || echo "not installed")
        echo "   OPA: $OPA_VERSION"

        TF_VERSION=$(terraform version -json 2>/dev/null | jq -r '.terraform_version' || echo "not installed")
        echo "   Terraform: $TF_VERSION"
        # Record the CONCRETE installed version (a range like ~1.10 resolves to a
        # specific patch) for the audit trail — exposed as an action output.
        echo "terraform-version=$TF_VERSION" >> "$GITHUB_OUTPUT"

    # =========================================================================
    # OIDC AUTHENTICATION (optional, when oidc input is true)
    # Inlined from setup-oidc/ to avoid nested composite action issues.
    # =========================================================================

    # =========================================================================
    # CONFIGURE REGISTRY (non-OIDC only)
    # When oidc is true, the pipeline configures registry per-stack after
    # each OIDC exchange. For non-OIDC (long-lived secrets), configure once.
    # =========================================================================
    - name: Configure Registry
      id: registry
      if: inputs.oidc != 'true'
      shell: bash
      env:
        REGISTRY_HOST: ${{ inputs.registry_host }}
      run: |
        set -euo pipefail

        # Source shared library
        ACTION_DIR="${GITHUB_ACTION_PATH:-$(dirname "$0")/..}"
        source "${ACTION_DIR}/scripts/lib/iltero-core/index.sh"

        TOKEN="${ILTERO_REGISTRY_TOKEN:-}"

        if configure_registry "$TOKEN" "$REGISTRY_HOST"; then
          if [[ -n "$TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    # -------------------------------------------------------------------------
    # Step 3: Detect Pipeline Mode
    # -------------------------------------------------------------------------
    - name: Detect Pipeline Mode
      id: validate
      shell: bash
      env:
        INPUT_STACKS_PATH: ${{ inputs.stacks_path }}
        INPUT_STACKS_CONFIG: ${{ inputs.stacks_config }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
      run: |
        set -euo pipefail

        STACKS_PATH="$INPUT_STACKS_PATH"
        STACKS_CONFIG="$INPUT_STACKS_CONFIG"
        CONFIG_PATH="$INPUT_CONFIG_PATH"

        # Detect pipeline mode
        if [[ -n "$STACKS_PATH" ]]; then
          PIPELINE_MODE="greenfield"
          echo "pipeline_mode=greenfield" >> "$GITHUB_OUTPUT"
          echo "config_path=" >> "$GITHUB_OUTPUT"
          if [[ -d "$STACKS_PATH" ]]; then
            echo "  Inputs validated (greenfield)"
            echo "   Stacks code path: $STACKS_PATH"
            echo "   Stacks config path: $STACKS_CONFIG"
          else
            echo "  Inputs validated (greenfield — stacks directory not yet present, no stacks to process)"
            echo "   Stacks code path: $STACKS_PATH"
            echo "   Stacks config path: $STACKS_CONFIG"
          fi
        elif [[ -f "$CONFIG_PATH" ]]; then
          PIPELINE_MODE="brownfield"
          echo "pipeline_mode=brownfield" >> "$GITHUB_OUTPUT"
          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "  Inputs validated (brownfield)"
          echo "   Config path: $CONFIG_PATH"
        else
          echo "::error::Neither stacks_path input nor brownfield config ($CONFIG_PATH) provided"
          exit 1
        fi

    # -------------------------------------------------------------------------
    # Step 4: Run Pipeline
    # -------------------------------------------------------------------------
    # Cloud credentials must be configured by the calling job before this
    # step runs (e.g. via ilterohq/iltero-actions/resolve-credentials@v1
    # or a hand-written aws-actions/configure-aws-credentials block). The
    # pipeline does not resolve or rotate cloud credentials itself —
    # workflow-topology decisions live in the workflow YAML.
    - name: Run Iltero Pipeline
      id: pipeline
      shell: bash
      env:
        STACKS_PATH: ${{ inputs.stacks_path }}
        STACKS_CONFIG: ${{ inputs.stacks_config }}
        PIPELINE_MODE: ${{ steps.validate.outputs.pipeline_mode }}
        CONFIG_PATH: ${{ steps.validate.outputs.config_path }}
        ENVIRONMENT_OVERRIDE: ${{ inputs.environment }}
        MANUAL_STACK: ${{ inputs.stack }}
        MODE: ${{ inputs.mode }}
        RUN_ID: ${{ inputs.run_id }}
        VERIFY_AUTHORIZATION: ${{ inputs.verify_authorization }}
        DEBUG: ${{ inputs.debug }}
        REGISTRY_HOST: ${{ inputs.registry_host }}
        OIDC_ENABLED: ${{ inputs.oidc }}
        ILTERO_ORG_ID: ${{ inputs.org_id }}
        # Provenance attestation (set explicitly from inputs so an ambient
        # ILTERO_ATTEST in the caller's env can't silently change behavior).
        ILTERO_ATTEST: ${{ inputs.attest }}
        ILTERO_S3_SSE: ${{ inputs.s3_sse }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Run the main pipeline script
        "${ACTION_PATH}/scripts/run-pipeline.sh"

    # -------------------------------------------------------------------------
    # Step 5: Generate Summary
    # -------------------------------------------------------------------------
    - name: Generate Summary
      if: always()
      shell: bash
      env:
        OVERALL_STATUS: ${{ steps.pipeline.outputs.overall_status }}
        STACKS_PROCESSED: ${{ steps.pipeline.outputs.stacks_processed }}
        STATIC_SCAN_PASSED: ${{ steps.pipeline.outputs.static_scan_passed }}
        EVALUATION_PASSED: ${{ steps.pipeline.outputs.evaluation_passed }}
        ENVIRONMENT: ${{ steps.pipeline.outputs.environment }}
        UNIT_RESULTS: ${{ steps.pipeline.outputs.unit_results }}
        TERRAFORM_VERSION: ${{ steps.setup.outputs.terraform-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "${ACTION_PATH}/scripts/generate-summary.sh"

    # -------------------------------------------------------------------------
    # Step 5b: Upload sanitized scan results as a downloadable artifact.
    # Advisory only: `continue-on-error` so a failed upload never fails the
    # compliance result. The tree is allowlist-sanitized (no runner-absolute
    # paths, no raw Terraform plan) by reporting.sh before this step runs.
    # -------------------------------------------------------------------------
    - name: Upload scan results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: iltero-scan-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: .iltero/report/
        retention-days: 14
        if-no-files-found: ignore

    # -------------------------------------------------------------------------
    # Step 6: Comment on PR
    # -------------------------------------------------------------------------
    - name: Comment on PR
      if: always() && github.event_name == 'pull_request' && inputs.comment_on_pr == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        OVERALL_STATUS: ${{ steps.pipeline.outputs.overall_status }}
        ENVIRONMENT: ${{ steps.pipeline.outputs.environment }}
        STATIC_SCAN_PASSED: ${{ steps.pipeline.outputs.static_scan_passed }}
        EVALUATION_PASSED: ${{ steps.pipeline.outputs.evaluation_passed }}
        UNIT_RESULTS: ${{ steps.pipeline.outputs.unit_results }}
        SEVERITY_THRESHOLD: ${{ steps.pipeline.outputs.severity_threshold }}
        RUN_ID: ${{ steps.pipeline.outputs.run_id }}
        # Enriched findings are read from the workspace, not a step output, so
        # multi-line finding text never hits the output size limit.
        FINDINGS_FILE: ${{ github.workspace }}/.iltero/report/pr-findings.json
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');

          const MARKER = '<!-- iltero-pipeline-comment -->';
          const MAX_CHARS = 60000;            // GitHub hard limit is 65536
          const BELOW_PER_UNIT = 10;          // below-threshold rows shown per unit

          const status = process.env.OVERALL_STATUS || 'unknown';
          const env = process.env.ENVIRONMENT || 'unknown';
          const scanPassed = process.env.STATIC_SCAN_PASSED === 'true';
          const evalPassed = process.env.EVALUATION_PASSED === 'true';
          const threshold = process.env.SEVERITY_THRESHOLD || 'high';
          const allPassed = status === 'success';
          const emoji = allPassed ? '✅' : '❌';

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const shortSha = (context.sha || '').slice(0, 7);

          // Severity presentation — always icon + word, never colour alone.
          const SEV = {
            critical: { icon: '🔴', word: 'Critical', rank: 4 },
            high:     { icon: '🟠', word: 'High', rank: 3 },
            medium:   { icon: '🟡', word: 'Medium', rank: 2 },
            low:      { icon: '⚪', word: 'Low', rank: 1 },
          };
          const sevRank = s => (SEV[s] ? SEV[s].rank : 0);
          const sevLabel = s => SEV[s] ? `${SEV[s].icon} ${SEV[s].word}` : `⚫ ${s || 'Unknown'}`;
          // Escape table-breaking characters in free text.
          const cell = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\r?\n+/g, ' ').trim();
          const clip = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

          // Enriched findings, written to the workspace by reporting.sh.
          let fdata = { findings: [], by_unit: [], total: 0, total_blocking: 0, total_below: 0, truncated: false };
          try {
            const f = process.env.FINDINGS_FILE;
            if (f && fs.existsSync(f)) {
              const parsed = JSON.parse(fs.readFileSync(f, 'utf8'));
              if (parsed && Array.isArray(parsed.findings)) fdata = parsed;
            }
          } catch (e) { /* advisory — degrade to counts-only */ }

          // Sum counts by unit NAME (the Zone-B table comes from UNIT_RESULTS,
          // which is a flat cross-stack array with no stack field). Summing on
          // collision keeps counts correct when two stacks share a unit name.
          const byUnit = {};
          for (const u of (fdata.by_unit || [])) {
            const e = byUnit[u.unit] || { blocking: 0, below: 0 };
            e.blocking += u.blocking || 0;
            e.below += u.below || 0;
            byUnit[u.unit] = e;
          }

          // ---- Zone A: verdict + context strip ----
          let body = `${MARKER}\n## ${emoji} Iltero Infrastructure Pipeline\n\n`;
          body += `**Static Analysis:** ${scanPassed ? '✅ Passed' : '❌ Failed'}  •  `;
          body += `**Plan Evaluation:** ${evalPassed ? '✅ Passed' : '❌ Failed'}\n\n`;

          if (allPassed) {
            body += `> No findings at or above the \`${threshold}\` threshold.`;
            if (fdata.total_below > 0) body += ` ${fdata.total_below} finding(s) below threshold (awareness only).`;
            body += `\n\n`;
          } else if (fdata.total_blocking > 0) {
            // "Blocking" = at or above the fail-on severity, OR any failed native
            // control (which has no severity). Kept generic so the count is accurate.
            body += `> **${fdata.total_blocking} blocking finding(s)** must be resolved before merge (at or above the \`${threshold}\` severity, plus any failed native control).`;
            if (fdata.total_below > 0) body += ` A further ${fdata.total_below} finding(s) are below threshold (awareness only).`;
            body += `\n\n`;
          } else {
            // Failed with no enumerated blocking findings (e.g. a needs-review
            // plan, or the findings file was unavailable) — point to detail.
            body += `> This run did not pass. See the per-unit results below and the [full results](${runUrl}) for detail.`;
            if (fdata.total_below > 0) body += ` ${fdata.total_below} finding(s) are below threshold (awareness only).`;
            body += `\n\n`;
          }

          body += `\`Environment\` ${cell(env)}  ·  \`Fail-on\` ${cell(threshold)}`;
          if (shortSha) body += `  ·  \`Commit\` ${shortSha}`;
          body += `  ·  [⬇ Download full results](${runUrl})\n\n`;

          // ---- Zone B: per-unit summary table ----
          let unitResults = [];
          try { unitResults = JSON.parse(process.env.UNIT_RESULTS || '[]'); } catch (e) { /* counts-only */ }
          if (unitResults.length > 0) {
            body += `### Units\n\n`;
            body += `| Unit | Static | Plan Evaluation | Blocking | Below |\n`;
            body += `|------|--------|-----------------|---------:|------:|\n`;
            for (const r of unitResults) {
              const scan = r.scan || {};
              const evl = r.evaluation || {};
              const scanStatus = scan.skipped ? '⏭️ Skip' : (scan.passed ? '✅ Pass' : '❌ Fail');
              const evalStatus = evl.skipped ? '⏭️ Skip' : (evl.passed ? '✅ Pass' : '❌ Fail');
              const u = byUnit[r.unit] || { blocking: 0, below: 0 };
              const blk = u.blocking > 0 ? `**${u.blocking}**` : '0';
              body += `| \`${cell(r.unit)}\` | ${scanStatus} | ${evalStatus} | ${blk} | ${u.below || 0} |\n`;
            }
            body += `\n`;
          }

          // ---- Zone C: per-unit finding detail (collapsed) ----
          // Render one finding row for the active phase's column set.
          const renderRows = (rows) => rows.map(v => {
            if (v.phase === 'evaluation') {
              const soc2 = (v.soc2_controls || []).length ? ` ${(v.soc2_controls || []).join(', ')}` : '';
              const control = `${v.framework || '—'}${soc2}` + (v.control_key ? ` · \`${cell(v.control_key)}\`` : '');
              return `| ${sevLabel(v.severity)} | ${control} | ${cell(clip(v.check_name, 80))} | ${cell(clip(v.description, 160))} |`;
            }
            const loc = v.file_path ? `\`${cell(v.file_path)}${v.line ? ':' + v.line : ''}\`` : '—';
            // Encode parens so a doc URL containing ")" can't close the md link early.
            const fix = v.remediation_url ? `[Docs ↗](${v.remediation_url.replace(/\(/g, '%28').replace(/\)/g, '%29')})` : '—';
            return `| ${sevLabel(v.severity)} | \`${cell(v.check_id)}\` | \`${cell(v.resource || '—')}\` | ${loc} | ${fix} |`;
          }).join('\n');
          const tableHeader = (phase) => phase === 'evaluation'
            ? `| Severity | Control | Check | Detail |\n|---|---|---|---|`
            : `| Severity | Check | Resource | File | Fix |\n|---|---|---|---|---|`;

          // Group displayed findings by stack+unit (two stacks can share a unit
          // name; keying by unit alone would merge and mislabel them).
          const units = [];
          const unitIdx = {};
          for (const v of (fdata.findings || [])) {
            const stack = v.stack || '';
            const unit = v.unit || '(unknown)';
            const key = stack + ' ' + unit;
            if (!(key in unitIdx)) { unitIdx[key] = units.length; units.push({ stack, unit, findings: [] }); }
            units[unitIdx[key]].findings.push(v);
          }
          const multiStack = new Set(units.map(u => u.stack)).size > 1;

          let deferredBelow = false;   // set when the char budget defers below-threshold detail
          if (units.length > 0) {
            body += `### Findings\n\n`;
            for (const grp of units) {
              const blocking = grp.findings.filter(v => v.blocking).sort((a, b) => sevRank(b.severity) - sevRank(a.severity));
              const belowAll = grp.findings.filter(v => !v.blocking).sort((a, b) => sevRank(b.severity) - sevRank(a.severity));
              const below = belowAll.slice(0, BELOW_PER_UNIT);
              const openAttr = blocking.length > 0 ? ' open' : '';
              const label = (multiStack && grp.stack) ? `${cell(grp.stack)} / ${cell(grp.unit)}` : cell(grp.unit);
              // Blocking tables are always rendered (never dropped) — the display
              // list is already bounded by build_pr_findings' cap.
              let section = `<details${openAttr}>\n<summary><b>${label}</b> — ${blocking.length} blocking, ${belowAll.length} below</summary>\n\n`;

              // Policy (OPA) + static blocking tables — exclude native checks,
              // which have no severity/file and get their own table below.
              for (const phase of ['evaluation', 'static']) {
                const b = blocking.filter(v => v.phase === phase && v.kind !== 'native_check');
                if (b.length) {
                  section += `**${phase === 'evaluation' ? 'Plan Evaluation' : 'Static Analysis'} — blocking**\n\n${tableHeader(phase)}\n${renderRows(b)}\n\n`;
                }
              }
              // Failing native check{} controls — no severity; always blocking.
              const native = blocking.filter(v => v.kind === 'native_check');
              if (native.length) {
                section += `**Native controls — failed**\n\n| Control | Result |\n|---|---|\n`;
                section += native.map(v => `| \`${cell(v.check_id)}\` | ${cell(v.description || 'Native check failed')} |`).join('\n') + `\n\n`;
              }
              // Below-threshold findings nested one level deeper, collapsed —
              // deferred (not rendered) if we're near the char budget.
              const belowByPhase = ['evaluation', 'static'].map(p => below.filter(v => v.phase === p)).filter(a => a.length);
              if (belowByPhase.length && (body.length + section.length) < MAX_CHARS) {
                section += `<details><summary>${belowAll.length} finding(s) below threshold</summary>\n\n`;
                for (const arr of belowByPhase) {
                  section += `${tableHeader(arr[0].phase)}\n${renderRows(arr)}\n\n`;
                }
                section += `</details>\n\n`;
              } else if (belowByPhase.length) {
                deferredBelow = true;
              }
              section += `</details>\n\n`;
              body += section;
            }
          }

          if (fdata.truncated || deferredBelow) {
            body += `> Some findings are not shown here. [Download the full results](${runUrl}) for the complete set.\n\n`;
          }

          body += `---\n`;
          body += `<sub>Advisory check — the merge gate is enforced by branch protection, not this comment. `;
          body += `Findings map SOC2 requirements to underlying technical controls (e.g. CIS AWS). `;
          body += `Powered by [Iltero](https://iltero.io)</sub>`;

          // The advisory comment is operator UX, not an evidence-chain artifact,
          // so a failure to post it must never fail the pipeline — degrade to a
          // warning. Posting requires the job to grant `pull-requests: write`; a
          // missing scope or a fork PR's read-only token lands in the catch.
          try {
            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body && (
                c.body.includes(MARKER) ||
                // Backward-compat: match comments posted before the marker existed.
                (c.body.includes('Iltero Infrastructure Pipeline') && c.body.includes('Powered by [Iltero]'))
              )
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
          } catch (error) {
            const status = error.status ? ` (HTTP ${error.status})` : '';
            core.warning(
              `Could not post the advisory PR comment${status}: ${error.message}. ` +
              `This does not affect the compliance result. Grant the job ` +
              `'pull-requests: write' if you want the summary comment.`
            );
          }
