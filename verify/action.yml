name: Iltero Verify
description: >-
  Build the record bundle of each unit, or of one unit: a folder that holds the unit's record and every file the
  record cites. Then check that the record and its files are unchanged.
author: Iltero

branding:
  icon: check-circle
  color: blue

inputs:
  environment:
    description: The environment the deploy or record-iac action recorded. The default artifact name includes it.
    required: true
  records-directory:
    description: The records directory, from the records-directory output of the deploy or record-iac action.
    required: true
  unit:
    description: >-
      The name of one unit to check, as `iltero units list` prints it. When it is empty, the action checks every unit.
      Use it after record-iac, which records one unit.
    required: false
    default: ""
  working-directory:
    description: The stack's directory, relative to the repository root.
    required: false
    default: "."
  write-report:
    description: >-
      true or false. When true, the CLI writes a report of each unit's record bundle for a person to read, as an HTML
      page and as Markdown. The action uploads both as the artifact <artifact-name>-report and adds the Markdown
      to the job summary. When the CLI does not write both files for a unit, the step fails at its end.
    required: false
    default: "true"
  artifact-name:
    description: >-
      Name of the artifact that holds the record bundles. The action adds -attempt-<attempt> to the name, where
      <attempt> is the pipeline run's attempt number, so a re-run keeps the record bundles of earlier attempts. When it
      is empty, the name is iltero-record-bundles-<environment>-attempt-<attempt>, or
      iltero-record-bundles-<environment>-<unit>-attempt-<attempt> when unit is set. The artifact-name output gives the
      full name.
    required: false
    default: ""

  retention-days:
    description: >-
      The number of days GitHub keeps the artifacts this action uploads, a whole number of 1 or more. When the input is empty, the
      repository's own artifact retention setting applies.
    required: false
    default: ""

outputs:
  artifact-name:
    description: The name of the artifact that holds the record bundles.
    value: ${{ steps.verify.outputs.artifact-name }}
  report-directory:
    description: The directory that holds the reports. Empty when write-report is false.
    value: ${{ steps.verify.outputs.report-directory }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        RETENTION_DAYS: ${{ inputs.retention-days }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/verify.sh" check'

    - name: Build and verify each record
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        RECORDS_DIRECTORY: ${{ inputs.records-directory }}
        UNIT: ${{ inputs.unit }}
        WRITE_REPORT: ${{ inputs.write-report }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/verify.sh" run "${RECORDS_DIRECTORY}"'

    - name: Upload the record bundles
      if: always() && steps.verify.outputs.bundles-path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.verify.outputs.artifact-name }}
        path: ${{ steps.verify.outputs.bundles-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Upload the reports
      if: always() && steps.verify.outputs.report-directory != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.verify.outputs.artifact-name }}-report
        path: ${{ steps.verify.outputs.report-directory }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
