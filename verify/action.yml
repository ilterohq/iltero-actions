name: Iltero Verify
description: >-
  Pack each unit's Change Assurance Record and every file it cites into a record bundle, and check the bundle.
author: Iltero

branding:
  icon: check-circle
  color: blue

inputs:
  environment:
    description: The environment the deploy action deployed. The default artifact name includes it.
    required: true
  records-directory:
    description: The records directory, from the deploy action's records-directory output.
    required: true
  working-directory:
    description: The stack's directory, relative to the repository root.
    required: false
    default: "."
  write-report:
    description: >-
      true or false. When true, the CLI writes a report of each unit's record bundle for a person to read, as an HTML
      page and as Markdown. The action uploads both as the artifact <artifact-name>-report and adds the Markdown
      to the job summary. When the CLI does not write both files for a unit, the step fails at its end.
    required: false
    default: "true"
  artifact-name:
    description: >-
      Name of the artifact that holds the record bundles. Empty: iltero-record-bundles-<environment>.
    required: false
    default: ""

outputs:
  artifact-name:
    description: The name of the artifact that holds the record bundles.
    value: ${{ steps.verify.outputs.artifact-name }}
  report-directory:
    description: The directory that holds the reports. Empty when write-report is false.
    value: ${{ steps.verify.outputs.report-directory }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/verify.sh" check'

    - name: Build and verify each record
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        RECORDS_DIRECTORY: ${{ inputs.records-directory }}
        WRITE_REPORT: ${{ inputs.write-report }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/verify.sh" run "${RECORDS_DIRECTORY}"'

    - name: Upload the record bundles
      if: always() && steps.verify.outputs.records-directory != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.verify.outputs.artifact-name }}
        path: ${{ steps.verify.outputs.records-directory }}/units/*/car-*/
        if-no-files-found: error

    - name: Upload the reports
      if: always() && steps.verify.outputs.report-directory != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.verify.outputs.artifact-name }}-report
        path: ${{ steps.verify.outputs.report-directory }}
        if-no-files-found: ignore
