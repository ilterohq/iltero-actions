name: Iltero Deploy
description: Plan, check and apply each unit of a stack, in a governed Iltero run or locally.
author: Iltero

branding:
  icon: upload-cloud
  color: blue

inputs:
  environment:
    description: The environment to deploy, as given to the open action in a governed run.
    required: true
  run-id:
    description: The run's id, from the open action. Required for a project linked to Iltero Platform; empty otherwise.
    required: false
    default: ""
  pins-digest:
    description: The run's pins digest, from the open action. Required with run-id; empty otherwise.
    required: false
    default: ""
  working-directory:
    description: The stack's directory, relative to the repository root.
    required: false
    default: "."
  registry-host:
    description: Host name of the private module registry. Leave empty when the stack uses no private modules.
    required: false
    default: ""
  artifact-name:
    description: Name of the artifact that holds the records.
    required: false
    default: iltero-deploy

outputs:
  out-dir:
    description: The directory that holds the records.
    value: ${{ steps.deploy.outputs.out-dir }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/deploy.sh" check'

    - name: Deploy each unit
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        RUN_ID: ${{ inputs.run-id }}
        PINS_DIGEST: ${{ inputs.pins-digest }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/deploy.sh" run "${ENVIRONMENT}" "${RUN_ID}" "${PINS_DIGEST}"'

    - name: Upload the records
      if: always() && steps.deploy.outputs.out-dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.deploy.outputs.out-dir }}
        retention-days: 90
        if-no-files-found: error
