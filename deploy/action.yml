name: Iltero Deploy
description: Plan, check and apply each unit of a stack, in a governed Iltero run or locally.
author: Iltero

branding:
  icon: upload-cloud
  color: blue

inputs:
  environment:
    description: The environment to deploy.
    required: true
  working-directory:
    description: The stack's directory, relative to the repository root.
    required: false
    default: "."
  registry-host:
    description: >-
      Host name of Iltero Platform's private module registry, from which terraform init downloads private modules.
      Leave empty when the stack uses no private modules. When it is set, the project must be linked to Iltero
      Platform, and the job needs id-token: write.
    required: false
    default: ""
  write-report:
    description: >-
      true or false. When true, the CLI writes a report of each unit's record for a person to read, as an HTML
      page and as Markdown. The action uploads both as the artifact <artifact-name>-report and adds the Markdown
      to the job summary. When the CLI does not write both files for a unit, the step fails at its end. A unit
      whose deploy failed sets the step's exit code.
    required: false
    default: "true"
  store-records:
    description: >-
      true or false. When true, the CLI keeps each stage's record and every file it cites in the run's artifact store, the
      bucket that Iltero Platform names for the run, with the job's own cloud credentials. Only in a project
      linked to Iltero Platform. A failed store fails the step.
    required: false
    default: "false"
  artifact-name:
    description: >-
      Name of the artifact that holds the records. Empty: iltero-deploy-<environment>. Two deploy steps in one
      pipeline run (on GitHub, one workflow run) that deploy the same environment need different names.
    required: false
    default: ""

outputs:
  records-directory:
    description: The directory that holds the records.
    value: ${{ steps.deploy.outputs.records-directory }}
  artifact-name:
    description: The name of the artifact that holds the records.
    value: ${{ steps.deploy.outputs.artifact-name }}
  report-directory:
    description: The directory that holds the reports. Empty when write-report is false.
    value: ${{ steps.deploy.outputs.report-directory }}
  readings-directory:
    description: >-
      The directory that holds the two readings of the deployed resources for each unit whose record expects the
      post-verify stage, as <unit>/first.json and <unit>/second.json. The readings can hold secret values. The action
      does not upload them, and they are not meant to be kept: the record keeps only their digests.
    value: ${{ steps.deploy.outputs.readings-directory }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/deploy.sh" check'

    - name: Deploy each unit
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REGISTRY_HOST: ${{ inputs.registry-host }}
        WRITE_REPORT: ${{ inputs.write-report }}
        STORE_RECORDS: ${{ inputs.store-records }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/deploy.sh" run "${ENVIRONMENT}"'

    - name: Upload the records
      if: always() && steps.deploy.outputs.records-directory != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.deploy.outputs.artifact-name }}
        path: ${{ steps.deploy.outputs.records-directory }}
        if-no-files-found: error

    - name: Upload the reports
      if: always() && steps.deploy.outputs.report-directory != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.deploy.outputs.artifact-name }}-report
        path: ${{ steps.deploy.outputs.report-directory }}
        if-no-files-found: ignore
