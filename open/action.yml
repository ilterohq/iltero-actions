name: Iltero Open Run
description: Open a governed Iltero run for the stack in .iltero/config.yml, and output its id and pins digest.
author: Iltero

branding:
  icon: unlock
  color: blue

inputs:
  environment:
    description: The environment the run deploys to.
    required: true
  working-directory:
    description: The stack's directory, relative to the repository root. Its .iltero/config.yml names the stack.
    required: false
    default: "."

outputs:
  run-id:
    description: The run's id. Pass it to every later job of the pipeline.
    value: ${{ steps.open.outputs.run_id }}
  pins-digest:
    description: The digest of the run's pins. Pass it to every later job of the pipeline.
    value: ${{ steps.open.outputs.pins_digest }}

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/run.sh" check'

    - name: Open the run
      id: open
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/run.sh" open "${ENVIRONMENT}"'
