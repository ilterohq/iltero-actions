name: Iltero Comment
description: Post the preview's result as a comment on the pull request, and update it on each push.
author: Iltero

branding:
  icon: message-square
  color: blue

inputs:
  artifact-name:
    description: The preview action's comment-artifact output.
    required: true

runs:
  using: composite
  steps:
    - name: Check the event and the job
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/comment.sh" check "${ARTIFACT_NAME}"'

    - name: Download the comment
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/iltero-comment

    - name: Post the comment
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: '"${GITHUB_ACTION_PATH}/../scripts/iac/comment.sh" post "${ARTIFACT_NAME}" "${RUNNER_TEMP}/iltero-comment/comment.md"'
